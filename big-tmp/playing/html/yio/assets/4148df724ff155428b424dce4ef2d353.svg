<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="243" viewBox="0,0,440,243"><g transform="translate(-20,-58)"><g stroke="none" stroke-miterlimit="10"><path d="M20,301v-243h440v243z" fill="#000000" stroke-width="0"/><text transform="translate(189.5,85.5) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Beta Notes</tspan></text><text transform="translate(27.5,107.1547) scale(0.4241,0.34557)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">currently there's quiet errors, we are gonna try</tspan><tspan x="0" dy="46.150000000000006px">and find a fix. if you don't see a send appear in </tspan><tspan x="0" dy="46.150000000000006px">receive, something went wrong.</tspan><tspan x="0" dy="46.150000000000006px">some feature may not be fully implemented</tspan><tspan x="0" dy="46.150000000000006px">press page down to choose local (just on your pc) or</tspan><tspan x="0" dy="46.150000000000006px">everyone (shows for everyone</tspan><tspan x="0" dy="46.150000000000006px">beta 2 fixes a huge bug where a constant check </tspan><tspan x="0" dy="46.150000000000006px">every millisecond would cause checking not to work,</tspan><tspan x="0" dy="46.150000000000006px">a 5 second delay has been introduced</tspan><tspan x="0" dy="46.150000000000006px">text moves until not blocked by logo</tspan><tspan x="0" dy="46.150000000000006px">you can manually refresh</tspan></text><text transform="translate(32.5,287.5) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">click to continue</tspan></text></g></g></svg>