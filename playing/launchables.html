<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launchables Integration Base & Testing GUI</title>
    <!-- Note: No external styling libraries included as requested. Minimal inline styles for testing GUI readability. -->
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        section { margin-bottom: 30px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        .item-list { display: flex; flex-wrap: wrap; gap: 15px; }
        .item-card { border: 1px solid #eee; padding: 10px; width: 250px; text-align: center; background: #f9f9f9; }
        .item-card img { max-width: 100%; height: auto; max-height: 150px; object-fit: contain; }
        button { cursor: pointer; padding: 5px 10px; margin-top: 5px; }
        label { display: block; margin-bottom: 10px; }
        #logs { background: #333; color: #0f0; padding: 10px; font-family: monospace; height: 150px; overflow-y: scroll; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>Launchables API Integrator (Testing GUI)</h1>
    <p>This page serves as a base implementation for fetching and processing Launchables data from a remote repository.</p>

    <!-- Experimental Settings -->
    <section>
        <h2>Settings</h2>
        <label>
            <input type="checkbox" id="experimentalBlobLoader"> 
            Enable Experimental Blob HTML Loader (Fetches raw HTML and injects <code>&lt;base&gt;</code>)
        </label>
    </section>

    <!-- Containers for the fetched data -->
    <section id="apps-container">
        <h2>Apps</h2>
        <div class="item-list" id="apps-list">Loading apps...</div>
    </section>

    <section id="games-container">
        <h2>Games</h2>
        <div class="item-list" id="games-list">Loading games...</div>
    </section>

    <section id="videos-container">
        <h2>Videos</h2>
        <div class="item-list" id="videos-list">Loading videos...</div>
    </section>

    <section>
        <h2>Integration Logs</h2>
        <div id="logs"></div>
    </section>

    <!-- 
        ========================================================================
        START OF LAUNCHABLES INTEGRATION SCRIPT
        Developers can copy this script block and adapt it for their own sites.
        ========================================================================
    -->
    <script>
        /*
         * Configuration & URLs
         */
        const CONFIG = {
            // The primary source file containing the APPS, STATIC_GAMES, and VIDEOS arrays defined as JS variables.
            DATA_URL: 'https://cdn.jsdelivr.net/gh/fidgetsetc/blockingames@main/playing/launchables.js',
            
            // Text file containing a list of valid domains for hosting the HTML content (fallback if not using blobs)
            DOMAINS_URL: 'https://cdn.jsdelivr.net/gh/fidgetsetc/blockingames@main/domains.txt',
            
            // The base path to prepend to relative image paths found in the data (e.g., './img/icon.png')
            // Images are located in the 'playing/' folder alongside the launchables.js data.
            IMAGE_BASE_URL: 'https://cdn.jsdelivr.net/gh/fidgetsetc/blockingames@main/playing/',
            
            // The base path used when constructing absolute URLs for HTML files, and injected as the <base> tag in blob mode.
            // Updated to point to the 'playing/' folder where the HTML files reside.
            HTML_BASE_URL: 'https://cdn.jsdelivr.net/gh/fidgetsetc/blockingames@main/playing/'
        };

        // State variables to hold the fetched data
        let launchablesData = { apps: [], games: [], videos: [] };
        let validDomains = [];

        // Helper function to write to the on-screen log for testing
        function logMsg(msg, isError = false) {
            const logs = document.getElementById('logs');
            const prefix = isError ? '[ERROR] ' : '[INFO] ';
            logs.innerHTML += prefix + msg + '\n';
            logs.scrollTop = logs.scrollHeight;
            if (isError) console.error(msg);
            else console.log(msg);
        }

        /**
         * Helper to resolve relative paths (e.g., "./path/to/img.png") to absolute URLs
         * based on a provided base URL.
         */
        function resolvePath(path, baseUrl) {
            if (!path || path === 'undefined') return '';
            // If path starts with './', strip it and prepend the base URL
            if (path.startsWith('./')) {
                return baseUrl + path.substring(2);
            }
            // If it's already an absolute URL (http/https), return as is
            if (path.startsWith('http')) {
                return path;
            }
            // Fallback: just append it
            return baseUrl + path;
        }

        /**
         * Step 1: Fetch the list of valid domains.
         * This is used if the experimental blob loader is OFF, allowing you to pick a valid host domain.
         */
        async function fetchDomains() {
            try {
                logMsg(`Fetching domains from: ${CONFIG.DOMAINS_URL}`);
                const response = await fetch(CONFIG.DOMAINS_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const text = await response.text();
                // Split by newline, trim whitespace, and filter out empty lines
                validDomains = text.split('\n').map(d => d.trim()).filter(d => d.length > 0);
                logMsg(`Loaded ${validDomains.length} domains.`);
            } catch (error) {
                logMsg(`Failed to load domains: ${error.message}`, true);
                // Fallback domain if fetching fails (optional, adjust as needed)
                validDomains = ['https://example-fallback.com/']; 
            }
        }

        /**
         * Step 2: Fetch and parse the main data file (launchables.js).
         * Updated to grab raw JS, log it, and parse by separating entries by '},'
         * and grabbing values inside '{}' without evaluating the entire file.
         */
        async function fetchLaunchablesData() {
            try {
                logMsg(`Fetching data from: ${CONFIG.DATA_URL}`);
                const response = await fetch(CONFIG.DATA_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const scriptText = await response.text();

                // Log the raw JS to the console as requested
                logMsg(`Grabbed raw JS successfully. Check the browser console to view it.`);
                console.log("=== RAW JS CONTENT ===");
                console.log(scriptText);
                console.log("======================");

                // Helper to parse the JS arrays using string manipulation
                function extractArrayItems(rawText, arrayName) {
                    const parsedItems = [];
                    // Look for where the array starts (e.g., "APPS = [")
                    const arrayStart = rawText.indexOf(`${arrayName} = [`);
                    if (arrayStart === -1) return parsedItems;

                    const bracketStart = rawText.indexOf('[', arrayStart);
                    let bracketEnd = rawText.indexOf('];', bracketStart);
                    
                    // Fallback if the array in the raw JS ends with ']' instead of '];'
                    if (bracketEnd === -1) {
                        bracketEnd = rawText.indexOf(']', bracketStart);
                    }
                    
                    if (bracketStart === -1 || bracketEnd === -1) return parsedItems;

                    // Extract the content inside the main array brackets
                    const arrayContent = rawText.substring(bracketStart + 1, bracketEnd).trim();

                    // Separate entries by "}," as requested
                    const entries = arrayContent.split('},');

                    entries.forEach(entry => {
                        entry = entry.trim();
                        // Strip trailing commas from the very last item if present
                        if (entry.endsWith(',')) entry = entry.slice(0, -1).trim();
                        if (!entry) return;

                        // Because we split by '},', the last '}' might be missing on chunks.
                        // Re-add the closing brace if it was stripped off.
                        if (!entry.endsWith('}')) {
                            entry += '}';
                        }

                        // Grab the values inside the {} by evaluating ONLY the isolated object string.
                        // This safely turns "{ id: 'id', name: 'name' }" into a usable JS object.
                        try {
                            const parsedObj = new Function(`return ${entry}`)();
                            if (parsedObj) parsedItems.push(parsedObj);
                        } catch(e) {
                            console.warn(`Skipping malformed entry in ${arrayName}:`, entry);
                        }
                    });

                    return parsedItems;
                }

                // Process each array section using the new string separator method
                launchablesData.apps = extractArrayItems(scriptText, 'APPS');
                launchablesData.games = extractArrayItems(scriptText, 'STATIC_GAMES');
                launchablesData.videos = extractArrayItems(scriptText, 'VIDEOS');

                logMsg(`Parsed data successfully. Apps: ${launchablesData.apps.length}, Games: ${launchablesData.games.length}, Videos: ${launchablesData.videos.length}`);
                
            } catch (error) {
                logMsg(`Failed to fetch or parse launchables data: ${error.message}`, true);
            }
        }

        /**
         * Experimental feature: Fetch RAW HTML, inject a <base> tag if missing, 
         * and return a Blob URL that can be opened in a new tab or iframe.
         */
        async function createBlobUrlFromHtml(htmlPath) {
            // Resolve the path to the raw HTML file using the configured base
            const absoluteHtmlUrl = resolvePath(htmlPath, CONFIG.HTML_BASE_URL);
            logMsg(`Experimental: Fetching raw HTML from ${absoluteHtmlUrl}`);

            try {
                const response = await fetch(absoluteHtmlUrl);
                if (!response.ok) throw new Error(`HTTP error fetching raw HTML: ${response.status}`);
                let rawHtml = await response.text();

                // Inject <base> tag into <head> if it doesn't already exist.
                // This ensures relative assets (css, js, img) inside that HTML file resolve against the source repo.
                if (!rawHtml.includes('<base')) {
                    // Simple injection: find <head> and insert right after. 
                    // Fallback to inserting at the very beginning if <head> is missing.
                    const baseTag = `<base href="${CONFIG.HTML_BASE_URL}">\n`;
                    if (rawHtml.toLowerCase().includes('<head>')) {
                        rawHtml = rawHtml.replace(/<head>/i, `<head>\n    ${baseTag}`);
                        logMsg("Injected <base> tag into existing <head>.");
                    } else {
                         rawHtml = baseTag + rawHtml;
                         logMsg("Injected <base> tag at the top of the document.");
                    }
                } else {
                    logMsg("<base> tag already exists in the target HTML, skipping injection.");
                }

                // Create a Blob from the modified HTML
                const blob = new Blob([rawHtml], { type: 'text/html' });
                // Generate a URL for the Blob
                return URL.createObjectURL(blob);

            } catch (error) {
                logMsg(`Error creating blob: ${error.message}`, true);
                return null; // Return null if it fails, so caller can handle it
            }
        }


        /**
         * Core Integration function: How to handle clicking a "Launch" button.
         */
        async function handleLaunch(itemSrc, isHtmlTarget = true) {
            // Prevent attempting to launch literal 'undefined' strings or empty paths
            if (!itemSrc || itemSrc === 'undefined') {
                logMsg(`Launch Error: Item source is missing or undefined. Check if the parsed JS object uses 'src' or 'url'.`, true);
                return;
            }

            const useBlob = document.getElementById('experimentalBlobLoader').checked;

            // Only attempt the blob loading if experimental mode is on AND it's an HTML target (not a video)
            if (useBlob && isHtmlTarget) {
                // Experimental Mode: Fetch raw HTML, create Blob, open Blob URL
                const blobUrl = await createBlobUrlFromHtml(itemSrc);
                if (blobUrl) {
                    logMsg(`Opening Blob URL in new tab...`);
                    // Open the generated blob URL in a new window/tab
                    window.open(blobUrl, '_blank');
                    
                    // Note for integrators: You might want to store this blobUrl 
                    // and revoke it using URL.revokeObjectURL(blobUrl) when the user closes the app
                    // to free up memory, though modern browsers usually handle cleanup on tab close.
                } else {
                     alert("Failed to load experimental blob. Check logs.");
                }
            } else {
                // Standard Mode: Construct URL using a valid domain + the src path
                // This mode is also forced for non-HTML targets like Videos.
                // For demonstration, we just pick the first valid domain from the list.
                // Integrators can implement logic to randomly select or select based on ping.
                const domain = validDomains.length > 0 ? validDomains[0] : CONFIG.HTML_BASE_URL; 
                
                // Make sure domain ends with slash and append the 'playing/' directory where the files live.
                let cleanDomain = domain.endsWith('/') ? domain : domain + '/';
                cleanDomain += 'playing/';
                
                let cleanSrc = itemSrc.startsWith('./') ? itemSrc.substring(2) : itemSrc;
                
                // Alternatively, if the itemSrc is already a full URL in standard mode, just use it.
                // We'll assume the src needs to be appended to the chosen domain for standard mode based on prompt context.
                let finalUrl = cleanSrc.startsWith('http') ? cleanSrc : cleanDomain + cleanSrc;

                logMsg(`Standard Launch: Opening ${finalUrl}`);
                window.open(finalUrl, '_blank');
            }
        }

        /**
         * Render the fetched data into the testing GUI.
         * Demonstrates how to map the data to HTML elements.
         */
        function renderGUI() {
            const renderSection = (items, containerId, isVideo = false) => {
                const container = document.getElementById(containerId);
                container.innerHTML = ''; // Clear "loading..." text

                if (!items || items.length === 0) {
                    container.innerHTML = '<p>No items found.</p>';
                    return;
                }

                items.forEach(item => {
                    // Fallback checks: The live data might use 'url' instead of 'src', or 'image'/'icon' instead of 'img'
                    const itemImage = item.img || item.image || item.icon || '';
                    const itemSource = item.src || item.url || item.path || item.link || '';

                    // Resolve the image path
                    const imgUrl = resolvePath(itemImage, CONFIG.IMAGE_BASE_URL);

                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${item.name || 'Unknown'}" onerror="this.src='https://placehold.co/150x150/eeeeee/999999?text=No+Image'">
                        <h3>${item.name || 'Unnamed Item'}</h3>
                        <p style="font-size: 0.8em; color: #666;">${item.h2 || item.description || ''}</p>
                        <!-- Safely pass the source string. Tell handleLaunch if this is NOT a video (so it can use the HTML blob loader) -->
                        <button onclick="handleLaunch('${itemSource}', ${!isVideo})">Launch</button>
                    `;
                    container.appendChild(card);
                });
            };

            // Pass 'true' for the video section to disable HTML blob processing for video links
            renderSection(launchablesData.apps, 'apps-list', false);
            renderSection(launchablesData.games, 'games-list', false);
            renderSection(launchablesData.videos, 'videos-list', true);
            
            logMsg("GUI Rendered.");
        }


        /**
         * Main initialization sequence that runs when the page loads.
         */
        async function init() {
            logMsg("Starting Integration Sequence...");
            
            // Fetch configuration lists first
            await fetchDomains();
            
            // Fetch the actual app/game/video data
            await fetchLaunchablesData();
            
            // Build the UI
            renderGUI();
        }

        // Run initialization on load
        window.addEventListener('DOMContentLoaded', init);

    </script>
    <!-- 
        ========================================================================
        END OF LAUNCHABLES INTEGRATION SCRIPT
        ========================================================================
    -->
</body>
</html>
