<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BID</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Logic for DogeUB... -->
    <style>
        :root {
            --win-radius: 3px;
            --win-border-width: 0px;
            --win-border-color: rgba(0,0,0,0.12);
            --icon-radius: 12px;
            --dock-icon-radius: 0px;
            --dock-radius: 16px;
            --accent-color: #1a73e8;
            --dock-size: 54px;
            --dock-item-size: 40px;
            --dock-gap: 10px;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #202124;
            user-select: none;
        }

        /* Fullscreen-No-Bars mode hides dock and desktop icons entirely */
        body.hide-chrome .shelf,
        body.hide-chrome .desktop-icons-container,
        body.hide-chrome .launcher {
            display: none !important;
        }

        /* Icon rearrange / edit-layout visual affordance */
        .icon-edit-mode .desktop-shortcut,
        .icon-edit-mode .shelf-item {
            outline: 1.5px dashed rgba(255,255,255,0.5);
            outline-offset: 2px;
            cursor: grab;
        }
        .icon-edit-mode .desktop-shortcut:active,
        .icon-edit-mode .shelf-item:active {
            cursor: grabbing;
        }
        .icon-drag-over {
            outline: 2px solid var(--accent-color) !important;
        }

        /* Appearance settings panel option chips */
        .appearance-option {
            border: 1.5px solid #e2e5e9;
            background: #fff;
            color: #4b5563;
            transition: all 0.15s ease;
        }
        .appearance-option:hover { background: #f3f4f6; }
        .appearance-option.appearance-option-active {
            border-color: var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 12%, white);
            color: var(--accent-color);
        }
        .appearance-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            border-radius: 3px;
            background: #e2e5e9;
            outline: none;
        }
        .appearance-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }
        .appearance-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            border: none;
            cursor: pointer;
        }

        
        #desktop-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        .desktop-icons-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 5;
        }
        /* Alternate desktop icon anchor positions, chosen from Appearance */
        .desktop-icons-container.pos-top-right {
            top: 20px; left: auto; right: 20px; align-items: flex-end;
        }
        .desktop-icons-container.pos-bottom-left {
            top: auto; bottom: 90px; left: 20px; align-items: flex-start;
        }
        .desktop-icons-container.pos-bottom-right {
            top: auto; bottom: 90px; left: auto; right: 20px; align-items: flex-end;
        }

        .desktop-shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            padding: 8px;
            border-radius: var(--icon-radius);
            cursor: pointer;
            text-align: center;
            color: white;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .desktop-shortcut:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
        }
        .desktop-shortcut:active {
            transform: scale(0.95);
        }

        .shelf {
            position: absolute;
            height: var(--dock-size);
            padding: 0 12px;
            background: rgba(32, 33, 36, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--dock-radius);
            display: flex;
            align-items: center;
            gap: var(--dock-gap);
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: calc(100vw - 24px); /* Prevent dock from expanding off-screen */
            overflow: visible; /* Let wobbly icons translate naturally on top of the dock */
        }

        /* Dock position variants (floating, with margin from the edge) */
        .shelf.dock-pos-bottom { bottom: 14px; left: 50%; top: auto; right: auto; transform: translateX(-50%); flex-direction: row; }
        .shelf.dock-pos-top { top: 14px; left: 50%; bottom: auto; right: auto; transform: translateX(-50%); flex-direction: row; }
        .shelf.dock-pos-left { left: 14px; top: 50%; bottom: auto; right: auto; transform: translateY(-50%); flex-direction: column; height: auto; max-height: calc(100vh - 24px); width: var(--dock-size); padding: 12px 0; }
        .shelf.dock-pos-right { right: 14px; top: 50%; bottom: auto; left: auto; transform: translateY(-50%); flex-direction: column; height: auto; max-height: calc(100vh - 24px); width: var(--dock-size); padding: 12px 0; }
        .shelf.dock-pos-left #pinned-apps, .shelf.dock-pos-right #pinned-apps { flex-direction: column; overflow-y: auto; overflow-x: hidden; }

        /* Separator line between pinned apps and the clock - orientation follows dock position */
        .shelf-divider {
            background: rgba(0, 0, 0, 0);
            flex-shrink: 0;
        }
        .shelf.dock-pos-bottom .shelf-divider,
        .shelf.dock-pos-top .shelf-divider {
            width: 1px;
            height: 24px;
        }
        .shelf.dock-pos-left .shelf-divider,
        .shelf.dock-pos-right .shelf-divider {
            width: 24px;
            height: 1px;
        }

        /* Clock / system status pill - reflows for vertical docks so it never overflows a narrow side dock */
        .shelf-clock {
            border-radius: var(--dock-icon-radius);
            background: rgba(0, 0, 0, 0);
            flex-shrink: 0;
        }
        .shelf.dock-pos-bottom .shelf-clock,
        .shelf.dock-pos-top .shelf-clock {
            padding: 0 5px;
            height: 20px;
            white-space: nowrap;
        }
        .shelf.dock-pos-left .shelf-clock,
        .shelf.dock-pos-right .shelf-clock {
            padding: 10px 4px;
            width: calc(var(--dock-item-size) + 6px);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            white-space: nowrap;
            justify-content: center;
        }

        /* Integrated (flush, edge-to-edge, square corners against the screen edge) dock mode */
        .shelf.dock-integrated.dock-pos-bottom { bottom: 0; left: 0; right: 0; width: 100%; max-width: 100%; transform: none; border-radius: var(--dock-radius) var(--dock-radius) 0 0; border-left: none; border-right: none; border-bottom: none; }
        .shelf.dock-integrated.dock-pos-top { top: 0; left: 0; right: 0; width: 100%; max-width: 100%; transform: none; border-radius: 0 0 var(--dock-radius) var(--dock-radius); border-left: none; border-right: none; border-top: none; }
        .shelf.dock-integrated.dock-pos-left { left: 0; top: 0; bottom: 0; height: 100%; max-height: 100%; transform: none; border-radius: 0 var(--dock-radius) var(--dock-radius) 0; border-left: none; border-top: none; border-bottom: none; }
        .shelf.dock-integrated.dock-pos-right { right: 0; top: 0; bottom: 0; height: 100%; max-height: 100%; transform: none; border-radius: var(--dock-radius) 0 0 var(--dock-radius); border-right: none; border-top: none; border-bottom: none; }

        /* App Icons on the Shelf (rounding controlled from Appearance, square by default) */
        .shelf-item {
            width: var(--dock-item-size);
            height: var(--dock-item-size);
            border-radius: var(--dock-icon-radius) !important;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0; /* Prevents any flex horizontal shrinking */
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .shelf-item:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-4px);
        }
        .shelf-item:active {
            transform: translateY(-1px) scale(0.95);
        }
        .shelf-item.active::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .shelf.dock-pos-left .shelf-item.active::after,
        .shelf.dock-pos-right .shelf-item.active::after {
            bottom: 50%;
            left: 3px;
            transform: translateY(50%);
            width: 3px;
            height: 14px;
        }

        /* Smooth scrollable pinned apps wrapper to prevent horizontal stretching and clock overflow */
        #pinned-apps {
            display: flex;
            gap: 8px;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden !important; /* Prevents vertical scrollbar on hover translateY */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            -webkit-overflow-scrolling: touch;
            
        }
        #pinned-apps::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
        /* When the dock is vertical (left/right positioned), fade top/bottom instead */
        .shelf.dock-pos-left #pinned-apps,
        .shelf.dock-pos-right #pinned-apps {
            
        }

        /* Responsive Window Drag Animations with Springy Wobbly Physics support */
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes windowClose {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            to {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
        }

        .window {
            position: absolute;
            background: #ffffff;
            color: #202124;
            border-radius: var(--win-radius);
            border: var(--win-border-width) solid var(--win-border-color);
            box-shadow: 0 16px 48px rgba(0,0,0,0.35);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            min-width: 320px;
            min-height: 240px;
            transform-origin: center center;
            /* Springy bounce back when dragging releases and dragging class is removed */
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        width 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        height 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        top 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        left 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* Disable transition properties strictly during active dragging to prevent lag */
        .window.dragging {
            transition: opacity 0.3s ease, width 0.3s ease, height 0.3s ease !important;
        }

        /* Full-viewport capture layer shown only while a window is being dragged or resized.
           It sits above everything else (icons, other windows, iframes, the shelf, etc.) so that
           fast mouse movement during a drag/resize can never "click through" to something behind
           the window, and so mouse events reliably reach our document-level handlers instead of
           being swallowed by an iframe. It is transparent and normally display:none. */
        #interaction-guard {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            background: transparent;
        }
        #interaction-guard.active {
            display: block;
        }
        #interaction-guard.cursor-move { cursor: move; }
        #interaction-guard.cursor-ew { cursor: ew-resize; }
        #interaction-guard.cursor-ns { cursor: ns-resize; }
        #interaction-guard.cursor-nwse { cursor: nwse-resize; }

        /* Belt-and-braces: while actively dragging/resizing, prevent text selection and any
           hover/click feedback from icons, dock items, and other windows from being perceived. */
        body.window-interacting {
            user-select: none !important;
        }
        body.window-interacting .shelf-item,
        body.window-interacting .desktop-icon,
        body.window-interacting .window:not(.dragging) {
            pointer-events: none !important;
        }

        .window.animate-open {
            animation: windowOpen 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .window.animate-close {
            animation: windowClose 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .window-header {
            height: 25px;
            background: #f1f3f4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            cursor: move;
            border-bottom: 1px solid #e8eaed;
            user-select: none;
        }

        .win-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #202124;
        }

        .win-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ChromeOS Authentic Minimize / Maximize / Close Buttons */
        .win-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px; /* Square window buttons */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f6368;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .win-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            color: #202124;
        }
        .win-btn.close-btn:hover {
            background: #e81123;
            color: #ffffff;
        }

        .window-content {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #ffffff;
        }

        /* Launcher Menu with Slide Animation & Refined Compact Spacing */
        .launcher {
            position: absolute;
            width: 620px;
            height: 400px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 40px);
            background: rgba(32, 33, 36, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 20px;
            display: none;
            flex-direction: column;
            padding: 20px; /* Adjusted padding from 24px for tighter spacing */
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
            color: white;
            z-index: 9999;
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Anchor the launcher next to the dock, sliding in from whichever edge the dock sits on */
        .launcher.anchor-bottom { bottom: calc(var(--dock-size) + 36px); left: 50%; transform: translateX(-50%) translateY(30px) scale(0.95); }
        .launcher.anchor-bottom.open { transform: translateX(-50%) translateY(0) scale(1); }
        .launcher.anchor-top { top: calc(var(--dock-size) + 36px); left: 50%; transform: translateX(-50%) translateY(-30px) scale(0.95); }
        .launcher.anchor-top.open { transform: translateX(-50%) translateY(0) scale(1); }
        .launcher.anchor-left { left: calc(var(--dock-size) + 36px); top: 50%; transform: translateY(-50%) translateX(-30px) scale(0.95); }
        .launcher.anchor-left.open { transform: translateY(-50%) translateX(0) scale(1); }
        .launcher.anchor-right { right: calc(var(--dock-size) + 36px); top: 50%; transform: translateY(-50%) translateX(30px) scale(0.95); }
        .launcher.anchor-right.open { transform: translateY(-50%) translateX(0) scale(1); }

        .launcher.open {
            display: flex !important;
            opacity: 1;
            pointer-events: auto;
        }

        /* Prevent vertical scrollbar flashes in the App Launcher when items scale on hover */
        #app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-top: 4px;
    padding-bottom: 4px;
}
        #app-grid::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Square App Grid items with Clean Balance */
        .app-grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 6px; /* Optimized app card margins */
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }
        .app-grid-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
        }
        .app-grid-item:active {
            transform: scale(0.95);
        }

        .context-menu {
            position: absolute;
            background: white;
            color: #202124;
            border: 1px solid #dadce0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 4px 0;
            z-index: 10000;
            display: none;
            min-width: 170px;
            transform-origin: top left;
            animation: contextOpen 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes contextOpen {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .context-menu-item {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s ease;
        }
        .context-menu-item:hover {
            background: #f1f3f4;
        }

        /* Custom scrollbar for standard windows */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #bdc1c6;
        }

        /* Custom Alert Notification Toast */
        #notification-toast {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(32, 33, 36, 0.9);
            color: white;
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10000;
            transform: translateY(-50px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #notification-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Custom System Interactive Dialog Modals (Replaces native blocking alerts/confirmations) */
        .system-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 15000;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .system-modal-content {
            background: #ffffff;
            color: #202124;
            width: 380px;
            border-radius: 14px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .system-modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .system-modal-overlay.active .system-modal-content {
            transform: scale(1);
        }

        /* Window Resize Handles */
        .resize-handle {
            position: absolute;
            z-index: 5;
        }
        .resize-handle.resize-r {
            top: 0;
            right: 0;
            bottom: 0;
            width: 6px;
            cursor: ew-resize;
        }
        .resize-handle.resize-b {
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            cursor: ns-resize;
        }
        .resize-handle.resize-br {
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
        }

        .shelf.dock-integrated #pinned-apps {
            justify-content: flex-start;
            flex: 1;
        }
        .shelf.dock-integrated .shelf-clock {
            margin-left: auto;
        }
    </style>
</head>
<body onclick="closeLauncherAndMenus(event)">

    <!-- Desktop Wallpaper Background Layer -->
    <div id="desktop-bg"></div>

    <!-- Desktop Shortcuts Container -->
    <div class="desktop-icons-container" id="desktop-icons">
        <!-- Dynamically rendered shortcuts -->
    </div>

    <!-- Custom Notification Toast -->
    <div id="notification-toast">
        <i data-lucide="info" class="w-5 h-5 text-blue-400"></i>
        <span id="toast-message" class="text-sm font-medium">Notification Message</span>
    </div>

    <!-- Reusable System Modal for Prompts & Confirmations (Strictly iframe friendly) -->
    <div id="sys-dialog-modal" class="system-modal-overlay">
        <div class="system-modal-content">
            <div class="flex gap-3">
                <div class="p-2 bg-blue-50 text-blue-600 rounded-lg shrink-0">
                    <i data-lucide="help-circle" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 id="sys-dialog-title" class="text-sm font-bold text-slate-800">System Notification</h3>
                    <p id="sys-dialog-desc" class="text-xs text-gray-500 mt-1">Modal dialogue descriptive question details.</p>
                </div>
            </div>
            
            <!-- Modal Input element dynamically shown for prompts -->
            <div id="sys-dialog-input-container" class="hidden flex-col gap-1">
                <input type="text" id="sys-dialog-input" class="w-full p-2.5 bg-slate-50 border border-gray-300 rounded-lg text-xs outline-none focus:border-blue-500 font-semibold text-slate-700">
            </div>

            <!-- Action buttons -->
            <div class="flex justify-end gap-2 text-xs font-semibold">
                <button id="sys-dialog-cancel" class="px-4 py-2 border border-gray-200 rounded-lg text-gray-600 hover:bg-slate-50 transition">Cancel</button>
                <button id="sys-dialog-ok" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition shadow-sm">OK</button>
            </div>
        </div>
    </div>

    <!-- Windows Workspace -->
    <!-- Transparent capture layer toggled on during window drag/resize; see #interaction-guard CSS -->
    <div id="interaction-guard"></div>

    <div id="win-container" class="absolute inset-0 overflow-hidden pointer-events-none z-10">
        <!-- Windows are dynamically injected here -->
    </div>

    <!-- Launcher Pop-up Menu -->

    <!-- App System Scripts & Implementations -->
    <script>
        // System State
        let systemApps = [
            { id: 'files', name: 'Files', icon: 'folder', color: 'bg-blue-500' },
            { id: 'settings', name: 'Appearance', icon: 'palette', color: 'bg-pink-500' },

            { id: 'filelock', name: 'File Lock', icon: 'lock', color: 'bg-red-500' },
            { id: 'customweb', name: 'Web Installer', icon: 'plus-circle', color: 'bg-teal-500' },

        let installedCustomApps = JSON.parse(localStorage.getItem('chromeos_custom_apps') || '[]');
        let defaultWallpaper = 'linear-gradient(135deg, #18191b 0%, #2b303c 50%, #471d2b 100%)';
        let wallpaperConfig = JSON.parse(localStorage.getItem('chromeos_wallpaper') || `{"type":"gradient","value":"${defaultWallpaper}"}`);

        // Dock (Shelf) pinned apps - which apps show up on the taskbar/dock by default.
        // Empty by default; the user pins apps themselves via the right-click menu.
        const dockPinnedRaw = localStorage.getItem('chromeos_dock_pinned');
        let dockPinned = dockPinnedRaw !== null ? JSON.parse(dockPinnedRaw) : [];
        if (dockPinnedRaw === null) {
            localStorage.setItem('chromeos_dock_pinned', JSON.stringify(dockPinned));
        }

        // Desktop pinned apps - which apps show up as desktop shortcuts by default
        let desktopPinned = JSON.parse(localStorage.getItem('chromeos_desktop_pinned') || 'null');
        if (!desktopPinned) {
            desktopPinned = ['files', ...installedCustomApps.map(a => a.id)];
            localStorage.setItem('chromeos_desktop_pinned', JSON.stringify(desktopPinned));
        }

        // ===== Appearance / Window-Effects Settings =====
        // Central config object controlling all visual customization: window
        // rounding/borders, icon rounding, accent color, dock position/size/
        // integration, and the 4 maximize behaviors.
        let appearanceSettings = Object.assign({
            windowRadius: 3,
            windowBorderWidth: 0,
            windowBorderColor: '#d0d0d0',
            iconRadius: 12,
            dockIconRadius: 0,
            dockRadius: 16,
            accentColor: '#1a73e8',
            dockSize: 54,       // dock thickness (height when bottom/top, width when left/right)
            dockItemSize: 40,   // icon size within the dock
            dockPosition: 'bottom', // bottom | top | left | right
            dockIntegrated: false,  // false = floating pill, true = flush full-edge panel
            desktopIconPosition: 'top-left', // top-left | top-right | bottom-left | bottom-right
            maximizeMode: 'floating', // floating | less-space | fullscreen | fullscreen-no-bars
            squareCornersMaximized: false // force square corners while a window is maximized
        }, JSON.parse(localStorage.getItem('chromeos_appearance') || '{}'));

        // Backward-compat: migrate the old floating/taskbar dock mode setting if present
        (function migrateLegacyDockMode() {
            const legacy = localStorage.getItem('chromeos_dock_mode');
            if (legacy && !localStorage.getItem('chromeos_appearance')) {
                appearanceSettings.dockIntegrated = (legacy === 'taskbar');
            }
        })();

        // Icon rearrange ("Edit Layout") mode - toggled from Appearance settings
        let iconEditMode = false;

        // ===== Sound Settings =====
        // uiSoundsEnabled/soundTheme control short interface sound effects (clicks, window
        // open/close, notifications). bgSoundEnabled/defaultBgSoundId/activeBgSoundId/bgVolume
        // control the ambient loop managed by the BG Sound app. "Default" is what Settings
        // configures (used to seed a fresh session); "active" is whatever is actually playing
        // right now and can be changed live from inside the BG Sound app itself.
        let soundSettings = Object.assign({
            uiSoundsEnabled: true,
            soundTheme: 'playful', // classic | playful | chiptune | chime
            bgSoundEnabled: false,
            defaultBgSoundId: 'rain',
            activeBgSoundId: 'rain',
            bgVolume: 0.35
        }, JSON.parse(localStorage.getItem('chromeos_sound_settings') || '{}'));
        if (!soundSettings.activeBgSoundId) soundSettings.activeBgSoundId = soundSettings.defaultBgSoundId;

        function saveSoundSettings() {
            localStorage.setItem('chromeos_sound_settings', JSON.stringify(soundSettings));
        }
        
        // Virtual File System (Fallback for Sandboxed Environments)
        let virtualFileSystem = JSON.parse(localStorage.getItem('chromeos_vfs') || '[]');
        if (virtualFileSystem.length === 0) {
            // Seed VFS with some beautiful default placeholder files
            virtualFileSystem = [
                { name: 'Welcome.txt', type: 'text/plain', content: 'Welcome to the DesktopUB Web UI!\n\nThis application simulates a full desktop with working system utilities:\n- Open files directly by double clicking inside "Files".\n- Change colors and wallpaper using "Appearance".\n- Create graphics and draw using "Image Paint".\n- Edit documents or write runnable files in the side-by-side live preview "Code Editor".\n- Protect files using password locked ZIP simulations in "File Lock".\n\nEnjoy the sandbox!' },
                { name: 'SampleCode.html', type: 'text/html', content: '<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f4f8; }\n    h1 { color: #1a73e8; }\n  </style>\n</head>\n<body>\n  <h1>Hello, Live Sandbox World!</h1>\n  <p>Modify this source code and view your changes instantly in real-time inside the companion preview window.</p>\n</body>\n</html>' },
                { name: 'AbstractArt.png', type: 'image/png', content: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%232b303c"/><circle cx="150" cy="120" r="60" fill="%23e74c3c" opacity="0.8"/><rect x="180" y="80" width="120" height="120" fill="%233498db" transform="rotate(15 240 140)" opacity="0.7"/></svg>' }
            ];
            localStorage.setItem('chromeos_vfs', JSON.stringify(virtualFileSystem));
        }

        // Active state
        let currentDirHandle = null; 
        let windowZIndex = 10;
        let activeWindows = {};

        // Custom OS Prompt/Confirmation dialogues (to bypass browser sandbox limitations)
        function systemPrompt(message, defaultValue = "") {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.className = 'absolute inset-0 bg-black/60 flex items-center justify-center pointer-events-auto z-[20000]';
                modal.innerHTML = `
                    <div class="bg-white rounded-xl shadow-2xl border border-gray-200 p-6 w-80 text-slate-800 animate-open">
                        <h4 class="text-sm font-bold text-gray-800 mb-2">System Prompt</h4>
                        <p class="text-xs text-gray-500 mb-3">${message}</p>
                        <input type="text" id="sys-prompt-input" value="${defaultValue}" class="w-full p-2 border border-gray-300 rounded-lg text-sm mb-4 outline-none focus:border-blue-500">
                        <div class="flex justify-end gap-3 text-xs font-semibold">
                            <button id="sys-prompt-cancel" class="px-3.5 py-2 text-gray-500 hover:bg-gray-100 rounded-lg transition">Cancel</button>
                            <button id="sys-prompt-ok" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">OK</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(parent = modal);
                const input = document.getElementById('customapp-icon') ? modal.querySelector('input') : document.getElementById('sys-prompt-input'); 
                const inputEl = modal.querySelector('input');
                inputEl.focus();
                inputEl.select();

                const cleanup = () => {
                    modal.remove();
                };

                document.getElementById('sys-prompt-cancel')?.addEventListener('click', () => {
                    cleanup();
                    resolve(null);
                });
                modal.querySelector('#sys-prompt-cancel').onclick = () => {
                    cleanup();
                    resolve(null);
                };
                modal.querySelector('#sys-prompt-ok').onclick = () => {
                    const value = inputEl.value;
                    cleanup();
                    resolve(value);
                };
            });
        }

        function systemConfirm(message, titleText = "System Confirm") {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.className = 'absolute inset-0 bg-black/60 flex items-center justify-center pointer-events-auto z-[20000]';
                modal.innerHTML = `
                    <div class="bg-white rounded-xl shadow-2xl border border-gray-200 p-6 w-80 text-slate-800 animate-open">
                        <h4 class="text-sm font-bold text-gray-800 mb-2">${titleText}</h4>
                        <p class="text-xs text-gray-500 mb-4">${message}</p>
                        <div class="flex justify-end gap-3 text-xs font-semibold">
                            <button id="sys-confirm-cancel" class="px-3.5 py-2 text-gray-500 hover:bg-gray-100 rounded-lg transition">Cancel</button>
                            <button id="sys-confirm-ok" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">Confirm</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                const cleanup = () => {
                    modal.remove();
                };

                modal.querySelector('#sys-confirm-cancel').onclick = () => {
                    cleanup();
                    resolve(false);
                };
                modal.querySelector('#sys-confirm-ok').onclick = () => {
                    cleanup();
                    resolve(true);
                };
            });
        }

        // Notification System
        function showToast(message, iconName = 'info') {
            const toast = document.getElementById('notification-toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
            toast.className = 'show';
            playUiSound('notify');
            setTimeout(() => {
                toast.className = '';
            }, 3000);
        }

        // ===== Sound Engine (Web Audio, no external files needed for UI FX) =====
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        // Browsers block audio until a user gesture happens - unlock on the first
        // click/keypress anywhere, and kick off the background loop if it was enabled
        // from a previous session.
        let audioUnlocked = false;
        function unlockAudioOnce() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            getAudioCtx();
            if (soundSettings.bgSoundEnabled) playBgSound(soundSettings.activeBgSoundId);
            document.removeEventListener('click', unlockAudioOnce);
            document.removeEventListener('keydown', unlockAudioOnce);
        }
        document.addEventListener('click', unlockAudioOnce);
        document.addEventListener('keydown', unlockAudioOnce);

        // Sound "themes" selectable from Settings. Each event maps to a little synthesized
        // blip - freq2 (if present) makes the pitch glide from freq -> freq2 over duration.
        const soundThemes = {
            classic: {
                click:    { freq: 620, duration: 0.045, wave: 'sine' },
                open:     { freq: 420, freq2: 640, duration: 0.14, wave: 'sine' },
                close:    { freq: 640, freq2: 360, duration: 0.14, wave: 'sine' },
                minimize: { freq: 520, freq2: 300, duration: 0.12, wave: 'sine' },
                maximize: { freq: 380, freq2: 720, duration: 0.12, wave: 'sine' },
                restore:  { freq: 720, freq2: 420, duration: 0.12, wave: 'sine' },
                notify:   { freq: 880, duration: 0.09, wave: 'sine' },
                error:    { freq: 220, duration: 0.22, wave: 'square' }
            },
            playful: {
                click:    { freq: 700, freq2: 900, duration: 0.06, wave: 'triangle' },
                open:     { notes: [523, 659, 784], noteDur: 0.07, wave: 'triangle' },
                close:    { notes: [659, 494, 330], noteDur: 0.07, wave: 'triangle' },
                minimize: { freq: 600, freq2: 200, duration: 0.15, wave: 'triangle' },
                maximize: { notes: [440, 660, 880], noteDur: 0.055, wave: 'square' },
                restore:  { notes: [880, 660, 440], noteDur: 0.055, wave: 'square' },
                notify:   { notes: [784, 988], noteDur: 0.07, wave: 'sine' },
                error:    { freq: 260, freq2: 160, duration: 0.28, wave: 'sawtooth' }
            },
            chiptune: {
                click:    { freq: 900, duration: 0.035, wave: 'square' },
                open:     { notes: [392, 523, 659, 784], noteDur: 0.05, wave: 'square' },
                close:    { notes: [784, 659, 523, 392], noteDur: 0.05, wave: 'square' },
                minimize: { freq: 500, freq2: 180, duration: 0.1, wave: 'square' },
                maximize: { notes: [330, 494, 659], noteDur: 0.05, wave: 'square' },
                restore:  { notes: [659, 494, 330], noteDur: 0.05, wave: 'square' },
                notify:   { notes: [988, 1318], noteDur: 0.06, wave: 'square' },
                error:    { freq: 150, duration: 0.3, wave: 'square' }
            },
            chime: {
                click:    { freq: 1000, duration: 0.07, wave: 'sine' },
                open:     { notes: [659, 880], noteDur: 0.18, wave: 'sine' },
                close:    { notes: [880, 659], noteDur: 0.18, wave: 'sine' },
                minimize: { freq: 700, freq2: 500, duration: 0.2, wave: 'sine' },
                maximize: { notes: [523, 784], noteDur: 0.16, wave: 'sine' },
                restore:  { notes: [784, 523], noteDur: 0.16, wave: 'sine' },
                notify:   { notes: [988, 1318], noteDur: 0.16, wave: 'sine' },
                error:    { freq: 300, freq2: 220, duration: 0.3, wave: 'triangle' }
            }
        };

        // Plays a single tone, optionally gliding from freq to freq2.
        function playTone({ freq, freq2, duration = 0.1, wave = 'sine', gain = 0.07, delay = 0 }) {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = wave;
            osc.frequency.setValueAtTime(freq, t0);
            if (freq2) osc.frequency.exponentialRampToValueAtTime(Math.max(freq2, 1), t0 + duration);
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + duration + 0.02);
        }

        // Plays UI feedback sounds for an event name (click/open/close/minimize/maximize/
        // restore/notify/error), honoring the master toggle and the currently selected theme.
        function playUiSound(eventName) {
            if (!soundSettings.uiSoundsEnabled) return;
            const theme = soundThemes[soundSettings.soundTheme] || soundThemes.classic;
            const def = theme[eventName];
            if (!def) return;
            if (def.notes) {
                def.notes.forEach((freq, i) => {
                    playTone({ freq, duration: def.noteDur, wave: def.wave, delay: i * def.noteDur * 0.85 });
                });
            } else {
                playTone(def);
            }
        }

        // ===== Background Ambient Sound (procedurally generated - no audio files to host) =====
        let bgSoundState = { master: null, nodes: [], timers: [] };

        function stopBgSound() {
            bgSoundState.timers.forEach(t => clearInterval(t));
            bgSoundState.timers = [];
            bgSoundState.nodes.forEach(n => { try { n.stop && n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
            bgSoundState.nodes = [];
            if (bgSoundState.master) {
                try { bgSoundState.master.disconnect(); } catch (e) {}
                bgSoundState.master = null;
            }
        }

        function makeNoiseBuffer(ctx, seconds = 2) {
            const buffer = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            return buffer;
        }

        function playBgSound(presetId) {
            stopBgSound();
            if (!soundSettings.bgSoundEnabled) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            const preset = bgSoundPresets.find(p => p.id === presetId);
            if (!preset) return;

            const master = ctx.createGain();
            master.gain.value = soundSettings.bgVolume;
            master.connect(ctx.destination);
            bgSoundState.master = master;

            if (preset.type === 'noise') {
                const src = ctx.createBufferSource();
                src.buffer = makeNoiseBuffer(ctx, 3);
                src.loop = true;
                const filter = ctx.createBiquadFilter();
                filter.type = preset.filter;
                filter.frequency.value = preset.freq;
                filter.Q.value = preset.q;
                const lfo = ctx.createOscillator();
                const lfoGain = ctx.createGain();
                lfo.frequency.value = preset.lfoRate;
                lfoGain.gain.value = preset.freq * preset.lfoDepth;
                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                src.connect(filter);
                filter.connect(master);
                src.start();
                lfo.start();
                bgSoundState.nodes.push(src, filter, lfo, lfoGain);
            } else if (preset.type === 'tone') {
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = preset.freq;
                const vibrato = ctx.createOscillator();
                const vibratoGain = ctx.createGain();
                vibrato.frequency.value = preset.vibratoRate;
                vibratoGain.gain.value = preset.vibratoDepth;
                vibrato.connect(vibratoGain);
                vibratoGain.connect(osc.frequency);
                osc.connect(master);
                osc.start();
                vibrato.start();
                bgSoundState.nodes.push(osc, vibrato, vibratoGain);
            } else if (preset.type === 'sparkle' || preset.type === 'crackle') {
                if (preset.noiseBed) {
                    const src = ctx.createBufferSource();
                    src.buffer = makeNoiseBuffer(ctx, 3);
                    src.loop = true;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 500;
                    const bedGain = ctx.createGain();
                    bedGain.gain.value = 0.25;
                    src.connect(filter);
                    filter.connect(bedGain);
                    bedGain.connect(master);
                    src.start();
                    bgSoundState.nodes.push(src, filter, bedGain);
                }
                const scheduleNext = () => {
                    const c = getAudioCtx();
                    if (!c) return;
                    const t0 = c.currentTime;
                    if (preset.type === 'sparkle') {
                        const freq = preset.baseFreqs[Math.floor(Math.random() * preset.baseFreqs.length)];
                        const osc = c.createOscillator();
                        const g = c.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq * (0.98 + Math.random() * 0.04);
                        const len = preset.chirpLen || 0.5;
                        g.gain.setValueAtTime(0.0001, t0);
                        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
                        osc.connect(g);
                        g.connect(master);
                        osc.start(t0);
                        osc.stop(t0 + len + 0.05);
                    } else {
                        // crackle: short filtered noise burst, like a spark popping
                        const src = c.createBufferSource();
                        src.buffer = makeNoiseBuffer(c, 0.08);
                        const filter = c.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = preset.freq * (0.7 + Math.random() * 0.6);
                        const g = c.createGain();
                        g.gain.setValueAtTime(0.3, t0);
                        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
                        src.connect(filter);
                        filter.connect(g);
                        g.connect(master);
                        src.start(t0);
                    }
                };
                scheduleNext();
                const scheduleLoop = () => {
                    const delay = preset.intervalMin + Math.random() * (preset.intervalMax - preset.intervalMin);
                    const id = setTimeout(() => {
                        if (bgSoundState.master !== master) return; // sound was switched/stopped
                        scheduleNext();
                        scheduleLoop();
                    }, delay);
                    bgSoundState.timers.push(id);
                };
                scheduleLoop();
            }
        }

        function setSoundSetting(key, val) {
            soundSettings[key] = val;
            saveSoundSettings();
            if (key === 'bgSoundEnabled') {
                if (val) {
                    playBgSound(soundSettings.activeBgSoundId);
                } else {
                    stopBgSound();
                }
                if (document.getElementById('win-bgsound')) injectAppContent('bgsound');
            }
            if (document.getElementById('win-settings')) injectAppContent('settings');
            if (key === 'uiSoundsEnabled' && val) playUiSound('click');
        }

        function setSoundTheme(id) {
            soundSettings.soundTheme = id;
            saveSoundSettings();
            playUiSound('open');
            if (document.getElementById('win-settings')) injectAppContent('settings');
        }

        function setDefaultBgSound(id) {
            soundSettings.defaultBgSoundId = id;
            saveSoundSettings();
            showToast('Default background sound updated!');
        }

        function setActiveBgSound(id) {
            soundSettings.activeBgSoundId = id;
            soundSettings.bgSoundEnabled = true;
            saveSoundSettings();
            playBgSound(id);
            if (document.getElementById('win-bgsound')) injectAppContent('bgsound');
            if (document.getElementById('win-settings')) injectAppContent('settings');
        }

        function setBgVolume(v) {
            soundSettings.bgVolume = v;
            saveSoundSettings();
            if (bgSoundState.master) {
                const ctx = getAudioCtx();
                bgSoundState.master.gain.setTargetAtTime(v, ctx.currentTime, 0.05);
            }
        }

        function stopBgSoundFromApp() {
            soundSettings.bgSoundEnabled = false;
            saveSoundSettings();
            stopBgSound();
            playUiSound('click');
            if (document.getElementById('win-bgsound')) injectAppContent('bgsound');
            if (document.getElementById('win-settings')) injectAppContent('settings');
        }

        // On Load Configuration
        window.addEventListener('DOMContentLoaded', () => {
            applyWallpaper();
            applyAppearanceSettings();
            renderAppLauncher();
            renderDesktopShortcuts();
            renderShelf();
            startSystemClock();
            lucide.createIcons();
            // Background sound (if it was left enabled last session) starts as soon as
            // the browser's autoplay restriction is lifted by the first click/keypress -
            // see unlockAudioOnce().
        });

        // Wallpaper Management
        function applyWallpaper() {
            const bg = document.getElementById('desktop-bg');
            if (wallpaperConfig.type === 'color') {
                bg.style.background = wallpaperConfig.value;
            } else if (wallpaperConfig.type === 'gradient') {
                bg.style.background = wallpaperConfig.value;
            } else if (wallpaperConfig.type === 'image') {
                bg.style.background = `url('${wallpaperConfig.value}')`;
                bg.style.backgroundSize = 'cover';
                bg.style.backgroundPosition = 'center';
            }
        }

        function setWallpaperPreset(presetType, val) {
            wallpaperConfig = { type: presetType, value: val };
            localStorage.setItem('chromeos_wallpaper', JSON.stringify(wallpaperConfig));
            applyWallpaper();
            showToast('Wallpaper personalized successfully!', 'image');
        }

        function handleWallpaperUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                wallpaperConfig = { type: 'image', value: e.target.result };
                localStorage.setItem('chromeos_wallpaper', JSON.stringify(wallpaperConfig));
                applyWallpaper();
                showToast('Custom wallpaper applied!', 'image');
            };
            reader.readAsDataURL(file);
        }

        // ===== Unified Appearance Engine =====
        // Applies every appearanceSettings field to the live DOM via CSS
        // variables and structural classes, then persists to localStorage.
        function saveAppearanceSettings() {
            localStorage.setItem('chromeos_appearance', JSON.stringify(appearanceSettings));
        }

        function applyAppearanceSettings() {
            const root = document.documentElement.style;
            root.setProperty('--win-radius', `${appearanceSettings.windowRadius}px`);
            root.setProperty('--win-border-width', `${appearanceSettings.windowBorderWidth}px`);
            root.setProperty('--win-border-color', appearanceSettings.windowBorderColor);
            root.setProperty('--icon-radius', `${appearanceSettings.iconRadius}px`);
            root.setProperty('--dock-icon-radius', `${appearanceSettings.dockIconRadius}px`);
            root.setProperty('--dock-radius', `${appearanceSettings.dockIntegrated ? 0 : appearanceSettings.dockRadius}px`);
            root.setProperty('--accent-color', appearanceSettings.accentColor);
            root.setProperty('--dock-size', `${appearanceSettings.dockSize}px`);
            root.setProperty('--dock-item-size', `${appearanceSettings.dockItemSize}px`);

            const shelf = document.getElementById('system-shelf');
            if (shelf) {
                shelf.classList.remove('dock-pos-bottom', 'dock-pos-top', 'dock-pos-left', 'dock-pos-right', 'dock-integrated');
                shelf.classList.add(`dock-pos-${appearanceSettings.dockPosition}`);
                if (appearanceSettings.dockIntegrated) shelf.classList.add('dock-integrated');
            }

            const iconsContainer = document.getElementById('desktop-icons');
            if (iconsContainer) {
                iconsContainer.classList.remove('pos-top-left', 'pos-top-right', 'pos-bottom-left', 'pos-bottom-right');
                if (appearanceSettings.desktopIconPosition !== 'top-left') {
                    iconsContainer.classList.add(`pos-${appearanceSettings.desktopIconPosition}`);
                }
            }

            const launcher = document.getElementById('launcher');
            if (launcher) {
                launcher.classList.remove('anchor-bottom', 'anchor-top', 'anchor-left', 'anchor-right');
                launcher.classList.add(`anchor-${appearanceSettings.dockPosition}`);
            }

            // Re-render so icon markup picks up the latest --dock-item-size / --dock-icon-radius
            if (typeof renderShelf === 'function') renderShelf();

            refreshAppearanceSettingsUI();
        }

        // Reserved edge space so "Less Space" maximize mode doesn't overlap the dock
        function getDockReservedSpace() {
            // No reservation needed if the window's own maximize mode hides the dock,
            // this is only used by 'less-space' mode which keeps the dock visible.
            const thickness = appearanceSettings.dockSize + (appearanceSettings.dockIntegrated ? 0 : 28);
            return thickness;
        }

        function setAppearance(key, value) {
            appearanceSettings[key] = value;
            saveAppearanceSettings();
            applyAppearanceSettings();
        }

        function setDockPosition(pos) {
            setAppearance('dockPosition', pos);
            showToast(`Dock moved to ${pos.charAt(0).toUpperCase() + pos.slice(1)}`);
        }

        function setDockIntegrated(flag) {

            showToast(flag ? 'Dock integrated flush with the edge' : 'Dock set to floating');
        }

        function setMaximizeMode(mode) {
            setAppearance('maximizeMode', mode);
            const labels = { floating: 'Floating', 'less-space': 'Less Space', fullscreen: 'Fullscreen', 'fullscreen-no-bars': 'Fullscreen (No Bars)' };
            showToast(`Maximize style set to ${labels[mode] || mode}`);
        }

        function setDesktopIconPosition(pos) {
            setAppearance('desktopIconPosition', pos);
            showToast('Desktop icon position updated');
        }

        function toggleIconEditMode() {
            iconEditMode = !iconEditMode;
            document.body.classList.toggle('icon-edit-mode', iconEditMode);
            renderDesktopShortcuts();

        function clearDockIcons() {

        // Re-highlights the currently-selected option buttons in the Appearance panel (if open)
        function refreshAppearanceSettingsUI() {
            const dockPosBtns = document.querySelectorAll('[data-dockpos]');
            dockPosBtns.forEach(btn => {
                btn.classList.toggle('appearance-option-active', btn.dataset.dockpos === appearanceSettings.dockPosition);
            });
            const maxModeBtns = document.querySelectorAll('[data-maxmode]');
            maxModeBtns.forEach(btn => {
                btn.classList.toggle('appearance-option-active', btn.dataset.maxmode === appearanceSettings.maximizeMode);
            });
            const desktopPosBtns = document.querySelectorAll('[data-desktoppos]');
            desktopPosBtns.forEach(btn => {
                btn.classList.toggle('appearance-option-active', btn.dataset.desktoppos === appearanceSettings.desktopIconPosition);
            });
            const integratedBtn = document.getElementById('dock-integrated-toggle');
            if (integratedBtn) integratedBtn.checked = !!appearanceSettings.dockIntegrated;
            const editBtn = document.getElementById('icon-edit-toggle-btn');

        // Time Generator
        function startSystemClock() {
            const timeEl = document.getElementById('system-time');
            const updateTime = () => {
                const now = new Date();
                timeEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };
            updateTime();
            setInterval(updateTime, 1000);
        }

        // Render strictly SQUARE app icons helper function.
        // Pass sizeClass="dock-auto" for shelf/dock icons so they actually scale
        // with the user's "Dock Icon Size" setting instead of a fixed Tailwind class.
        function getSquareIconHtml(app, sizeClass = "w-9 h-9") {
            const isAuto = sizeClass === 'dock-auto';
            const cls = isAuto ? 'aspect-square' : `${sizeClass} aspect-square rounded-none`;
            const style = isAuto ? `style="width:calc(var(--dock-item-size) - 6px);height:calc(var(--dock-item-size) - 6px);border-radius:var(--dock-icon-radius);"` : '';
            if (app.type === 'custom' && app.iconUrl) {
                return `<img src="${app.iconUrl}" ${style} class="${cls} object-cover shadow-sm bg-white flex-shrink-0" onerror="this.onerror=null; this.outerHTML='<div ${style} class=&quot;${cls} bg-teal-600 flex items-center justify-center text-white font-bold text-sm&quot;>${app.name.charAt(0)}</div>'">`;
            } else if (app.type === 'custom') {
                return `<div ${style} class="${cls} bg-teal-600 flex items-center justify-center text-white font-bold text-sm shadow-md flex-shrink-0">${app.name.charAt(0)}</div>`;
            } else {
                return `<div ${style} class="${cls} ${app.color} flex items-center justify-center text-white shadow-sm shadow-black/20 flex-shrink-0"><i data-lucide="${app.icon}" class="w-4 h-4"></i></div>`;
            }
        }

        // Shelf & App Windows Lifecycle
        function renderShelf() {
            const shelfContainer = document.getElementById('pinned-apps');
            shelfContainer.innerHTML = '';

            const allApps = [...systemApps, ...installedCustomApps];
            // Dock shows pinned apps PLUS any currently running app (even if unpinned), like a real taskbar
            const runningIds = Object.keys(activeWindows);
            const idsToShow = [...new Set([...dockPinned, ...runningIds])];

            if (idsToShow.length === 0) {
                shelfContainer.innerHTML = `
                    <div class="text-[10px] leading-tight text-white/50 font-medium text-center px-2 whitespace-normal">
                        Add apps here from the launcher; right-click an app, then "Add to Dock." Make sure to also change your background and other settings in Appearance to make the desktop yours.
                    </div>
                `;
                return;
            }

            idsToShow.forEach(id => {
                const app = allApps.find(a => a.id === id);
                if (!app) return;
                const isRunning = !!activeWindows[app.id];

                const shelfItem = document.createElement('div');
                shelfItem.className = `shelf-item flex items-center justify-center transition ${isRunning ? 'active bg-white/10' : ''}`;
                shelfItem.title = app.name;
                shelfItem.dataset.appId = app.id;
                shelfItem.onclick = () => { if (!iconEditMode) launchApp(app.id); };
                shelfItem.oncontextmenu = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    openAppContextMenu(e, app);
                };

                if (iconEditMode) {
                    shelfItem.draggable = true;
                    shelfItem.ondragstart = (e) => {
                        e.dataTransfer.setData('text/plain', app.id);
                        e.dataTransfer.effectAllowed = 'move';
                    };
                    shelfItem.ondragover = (e) => { e.preventDefault(); shelfItem.classList.add('icon-drag-over'); };
                    shelfItem.ondragleave = () => shelfItem.classList.remove('icon-drag-over');
                    shelfItem.ondrop = (e) => {
                        e.preventDefault();
                        shelfItem.classList.remove('icon-drag-over');
                        const draggedId = e.dataTransfer.getData('text/plain');
                        reorderDockIcon(draggedId, app.id);
                    };
                }

                shelfItem.innerHTML = getSquareIconHtml(app, "dock-auto");
                shelfContainer.appendChild(shelfItem);
            });
            lucide.createIcons();
        }

        // Reorders dockPinned by moving draggedId to sit just before targetId
        function reorderDockIcon(draggedId, targetId) {
            if (draggedId === targetId) return;
            if (!dockPinned.includes(draggedId) || !dockPinned.includes(targetId)) {
                // Only pinned icons can be reordered within the persisted pin list
                return;
            }
            dockPinned = dockPinned.filter(x => x !== draggedId);
            const targetIndex = dockPinned.indexOf(targetId);
            dockPinned.splice(targetIndex, 0, draggedId);
            localStorage.setItem('chromeos_dock_pinned', JSON.stringify(dockPinned));
            renderShelf();
        }

        function renderDesktopShortcuts() {
            const container = document.getElementById('desktop-icons');
            container.innerHTML = '';

            const allApps = [...systemApps, ...installedCustomApps];

            desktopPinned.forEach(id => {
                const app = allApps.find(a => a.id === id);
                if (!app) return;

                const appEl = document.createElement('div');
                appEl.className = 'desktop-shortcut';
                appEl.dataset.appId = app.id;
                appEl.onclick = () => { if (!iconEditMode) launchApp(app.id); };
                appEl.oncontextmenu = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    openAppContextMenu(e, app);
                };

                if (iconEditMode) {
                    appEl.draggable = true;
                    appEl.ondragstart = (e) => {
                        e.dataTransfer.setData('text/plain', app.id);
                        e.dataTransfer.effectAllowed = 'move';
                    };
                    appEl.ondragover = (e) => { e.preventDefault(); appEl.classList.add('icon-drag-over'); };
                    appEl.ondragleave = () => appEl.classList.remove('icon-drag-over');
                    appEl.ondrop = (e) => {
                        e.preventDefault();
                        appEl.classList.remove('icon-drag-over');
                        const draggedId = e.dataTransfer.getData('text/plain');
                        reorderDesktopIcon(draggedId, app.id);
                    };

                let iconBlockHtml = "";
                if (app.type === 'custom' && app.iconUrl) {
                    iconBlockHtml = `<img src="${app.iconUrl}" class="w-12 h-12 rounded-none object-cover shadow-lg mb-1" onerror="this.onerror=null; this.outerHTML='<div class=&quot;w-12 h-12 bg-teal-600 rounded-none flex items-center justify-center text-white font-bold text-lg shadow-lg mb-1&quot;>${app.name.charAt(0)}</div>'">`;
                } else if (app.type === 'custom') {
                    iconBlockHtml = `<div class="w-12 h-12 bg-teal-600 rounded-none flex items-center justify-center text-white font-bold text-lg shadow-lg mb-1">${app.name.charAt(0)}</div>`;
                } else {
                    iconBlockHtml = `<div class="w-12 h-12 ${app.color} rounded-none flex items-center justify-center shadow-lg mb-1"><i data-lucide="${app.icon}" class="w-6 h-6 text-white"></i></div>`;
                }

                appEl.innerHTML = `
                    ${iconBlockHtml}
                    <span class="text-xs font-semibold leading-tight text-white truncate w-full">${app.name}</span>
                `;
                container.appendChild(appEl);
            });
            lucide.createIcons();
        }

        // Reorders desktopPinned by moving draggedId to sit just before targetId
        function reorderDesktopIcon(draggedId, targetId) {
            if (draggedId === targetId) return;
            if (!desktopPinned.includes(draggedId) || !desktopPinned.includes(targetId)) return;
            desktopPinned = desktopPinned.filter(x => x !== draggedId);
            const targetIndex = desktopPinned.indexOf(targetId);
            desktopPinned.splice(targetIndex, 0, draggedId);
            localStorage.setItem('chromeos_desktop_pinned', JSON.stringify(desktopPinned));
            renderDesktopShortcuts();
        }

        // Launcher Popup logic
        function toggleLauncher(event) {
            if (event) event.stopPropagation();
            playUiSound('click');
            const l = document.getElementById('launcher');
            const isVisible = l.classList.contains('open');
            if (isVisible) {
                l.classList.remove('open');
                setTimeout(() => { l.style.display = 'none'; }, 400);
            } else {
                l.style.display = 'flex';
                // Trigger dynamic browser frame reflow
                setTimeout(() => { l.classList.add('open'); }, 10);
            }
        }

        function closeLauncherAndMenus(event) {
            const l = document.getElementById('launcher');
            if (l.classList.contains('open')) {
                l.classList.remove('open');
                setTimeout(() => { l.style.display = 'none'; }, 400);
            }
            document.getElementById('context-menu').style.display = 'none';
        }

        function renderAppLauncher() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';
            
            const allApps = [...systemApps, ...installedCustomApps];

                    iconBlockHtml = `<img src="${app.iconUrl}" class="w-12 h-12 rounded-none object-cover shadow-lg mb-2" onerror="this.onerror=null; this.outerHTML='<div class=&quot;w-12 h-12 bg-teal-600 rounded-none flex items-center justify-center text-white text-lg font-bold shadow-lg mb-2&quot;>${app.name.charAt(0)}</div>'">`;
                } else if (app.type === 'custom') {
                    iconBlockHtml = `<div class="w-12 h-12 bg-teal-600 rounded-none flex items-center justify-center text-white text-lg font-bold shadow-lg mb-2">${app.name.charAt(0)}</div>`;
                } else {
                    iconBlockHtml = `<div class="w-12 h-12 ${app.color} rounded-none flex items-center justify-center text-white shadow-lg mb-2"><i data-lucide="${app.icon}" class="w-6 h-6"></i></div>`;

        function filterLauncherApps() {
            const query = document.getElementById('launcher-search').value.toLowerCase();
            const items = document.querySelectorAll('.app-grid-item');
            const allApps = [...systemApps, ...installedCustomApps];
            
            items.forEach((item, index) => {
                const app = allApps[index];
                if (app && app.name.toLowerCase().includes(query)) {
                    item.style.display = 'flex';

        // Unified App Context Menu (right-click on a dock icon, desktop shortcut, or launcher tile)
        function openAppContextMenu(e, app) {
            const menu = document.getElementById('context-menu');
            menu.style.display = 'block';
            menu.style.left = `${e.clientX}px`;
            menu.style.top = `${e.clientY}px`;

            const inDock = dockPinned.includes(app.id);
            const onDesktop = desktopPinned.includes(app.id);
            const isRunning = !!activeWindows[app.id];
            const isCustom = app.type === 'custom';

            let html = `<div class="context-menu-item font-bold text-[10px] text-gray-400 tracking-wider uppercase border-b border-gray-100 pb-1 mb-1">${app.name}</div>`;

            html += `<div class="context-menu-item" onclick="launchApp('${app.id}')">
                <i data-lucide="external-link" class="w-3.5 h-3.5 text-blue-500"></i> ${isRunning ? 'Show Window' : 'Open App'}
            </div>`;

            html += `<div class="context-menu-item" onclick="toggleDockPin('${app.id}')">
                <i data-lucide="${inDock ? 'pin-off' : 'pin'}" class="w-3.5 h-3.5 text-gray-500"></i> ${inDock ? 'Remove from Dock' : 'Add to Dock'}
            </div>`;

            html += `<div class="context-menu-item" onclick="toggleDesktopPin('${app.id}')">
                <i data-lucide="${onDesktop ? 'monitor-x' : 'monitor'}" class="w-3.5 h-3.5 text-gray-500"></i> ${onDesktop ? 'Remove from Desktop' : 'Add to Desktop'}
            </div>`;

            if (isRunning) {
                html += `<div class="context-menu-item" onclick="closeWindow('${app.id}')">
                    <i data-lucide="x" class="w-3.5 h-3.5 text-gray-500"></i> Close App
                </div>`;
            }

            if (isCustom) {
                html += `<div class="context-menu-item border-t border-gray-100 mt-1 pt-1 text-red-600 font-semibold" onclick="deleteCustomApp('${app.id}')">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5 text-red-600"></i> Delete App
                </div>`;
            }

            menu.innerHTML = html;
            lucide.createIcons();
        }

        // Toggle whether an app is pinned to the dock/shelf
        function toggleDockPin(id) {
            document.getElementById('context-menu').style.display = 'none';
            const app = [...systemApps, ...installedCustomApps].find(a => a.id === id);
            if (!app) return;

            if (dockPinned.includes(id)) {
                dockPinned = dockPinned.filter(x => x !== id);
            } else {
                dockPinned.push(id);
            }
            localStorage.setItem('chromeos_dock_pinned', JSON.stringify(dockPinned));

            renderShelf();
            showToast(dockPinned.includes(id) ? `Pinned "${app.name}" to dock` : `Removed "${app.name}" from dock`);
        }

        // Toggle whether an app is pinned to the desktop
        function toggleDesktopPin(id) {
            document.getElementById('context-menu').style.display = 'none';
            const app = [...systemApps, ...installedCustomApps].find(a => a.id === id);
            if (!app) return;

            if (desktopPinned.includes(id)) {
                desktopPinned = desktopPinned.filter(x => x !== id);
            } else {
                desktopPinned.push(id);
            }
            localStorage.setItem('chromeos_desktop_pinned', JSON.stringify(desktopPinned));

            renderDesktopShortcuts();
            showToast(desktopPinned.includes(id) ? `Added "${app.name}" to desktop` : `Removed "${app.name}" from desktop`);
        }

        // Remove an installed custom web app entirely (dock, launcher, desktop, open window)
        async function deleteCustomApp(id) {
            document.getElementById('context-menu').style.display = 'none';

            const app = installedCustomApps.find(a => a.id === id);
            if (!app) return;

            const confirmed = await systemConfirm(`Are you sure you want to remove "${app.name}"? This cannot be undone.`, "Delete App");
            if (!confirmed) return;

            // Close and fully remove its window if currently open
            const win = document.getElementById(`win-${id}`);
            if (win) {
                win.remove();
            }
            delete activeWindows[id];

            // Remove from registry and persist
            installedCustomApps = installedCustomApps.filter(a => a.id !== id);
            localStorage.setItem('chromeos_custom_apps', JSON.stringify(installedCustomApps));

            // Also unpin from dock and desktop
            dockPinned = dockPinned.filter(x => x !== id);
            desktopPinned = desktopPinned.filter(x => x !== id);
            localStorage.setItem('chromeos_dock_pinned', JSON.stringify(dockPinned));
            localStorage.setItem('chromeos_desktop_pinned', JSON.stringify(desktopPinned));

            // Re-render all surfaces
            renderAppLauncher();
            renderDesktopShortcuts();
            renderShelf();
            renderInstalledCustomAppsList();

            showToast(`App "${app.name}" removed.`);
        }

        // Window Manager Shell (Drag, Focus, Resize, Sizing Actions with Wobbly Physics)
        function launchApp(id, fileToOpen = null) {
            let win = document.getElementById(`win-${id}`);
            
            if (!win) {
                // Initialize specific window templates on demand
                createDynamicAppWindow(id);
                win = document.getElementById(`win-${id}`);
            }

            if (win.style.display !== 'flex') {
                win.style.display = 'flex';
                win.classList.remove('animate-close');
                win.classList.add('animate-open');
                setTimeout(() => {
                    win.classList.remove('animate-open');
                }, 350);
                playUiSound('open');
            } else {
                playUiSound('click');
            }
            
            focusWindow(win);
            renderShelf();

            // Handle file input logic
            if (fileToOpen) {
                handleFileOpenInApp(id, fileToOpen);
            }
        }

        function focusWindow(win) {
            windowZIndex += 1;
            win.style.zIndex = windowZIndex;
            document.querySelectorAll('.window').forEach(w => w.classList.add('opacity-90'));
            win.classList.remove('opacity-90');
        }

        function createDynamicAppWindow(id) {
            const container = document.getElementById('win-container');
            const win = document.createElement('div');
            win.id = `win-${id}`;
            win.className = 'window pointer-events-auto';
            win.style.width = '700px';
            win.style.height = '480px';
            win.style.top = `${80 + (windowZIndex % 5) * 20}px`;
            win.style.left = `${100 + (windowZIndex % 5) * 20}px`;
            win.style.display = 'none';
            win.onmousedown = () => focusWindow(win);

            const isCustom = installedCustomApps.find(a => a.id === id);
            let appName = "";
            let appIconHtml = "";
            
            if (isCustom) {
                appName = isCustom.name;
                appIconHtml = getSquareIconHtml(isCustom, "w-5 h-5");
            } else {
                const appObj = systemApps.find(a => a.id === id);
                appName = appObj.name;
                appIconHtml = getSquareIconHtml(appObj, "w-5 h-5");
            }

            win.innerHTML = `
                <div class="window-header" onmousedown="dragWindowStart(event, '${id}')">
                    <div class="win-title-container">
                        <div class="flex items-center justify-center shrink-0 text-slate-700">
                            ${appIconHtml}
                        </div>
                        <span id="win-title-text-${id}" class="truncate max-w-[200px] text-xs font-semibold text-gray-800">${appName}</span>
                    </div>
                    <div class="win-controls">
                        <div class="win-btn" onclick="minimizeWindow('${id}')"><i data-lucide="minus" class="w-3.5 h-3.5"></i></div>
                        <div class="win-btn" onclick="toggleMaximizeWindow('${id}')"><i data-lucide="square" class="w-3 h-3"></i></div>
                        <div class="win-btn close-btn" onclick="closeWindow('${id}')"><i data-lucide="x" class="w-3.5 h-3.5"></i></div>
                    </div>
                </div>
                <div class="window-content flex flex-col h-full bg-[#f8f9fa]" id="win-body-${id}">
                    <!-- Custom Window Content Handlers -->
                </div>
                <div class="resize-handle resize-r" onmousedown="startResize(event, '${id}', 'r')"></div>
                <div class="resize-handle resize-b" onmousedown="startResize(event, '${id}', 'b')"></div>
                <div class="resize-handle resize-br" onmousedown="startResize(event, '${id}', 'br')"></div>
            `;

        // Custom sandbox iframe loader logic
