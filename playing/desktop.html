        // Dragging & Sizing Window Helper Scripts with simulated Wobbly jelly physics
        let activeDragElement = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // Turns on the transparent full-viewport guard (and a body-level lock) while a window
        // is being dragged or resized. This is what stops "accidental interaction": with the
        // guard up, fast mouse movement can't click desktop icons, dock items, other windows,
        // or reach into iframes — it all just hits the guard layer instead, which is exactly
        // what feeds our drag/resize math. kind: 'move' | 'ew' | 'ns' | 'nwse' picks the cursor.
        function beginWindowInteraction(kind) {
            const guard = document.getElementById('interaction-guard');
            if (guard) {
                guard.classList.remove('cursor-move', 'cursor-ew', 'cursor-ns', 'cursor-nwse');
                guard.classList.add('active', `cursor-${kind}`);
            }
            document.body.classList.add('window-interacting');
        }

        function endWindowInteraction() {
            const guard = document.getElementById('interaction-guard');
            if (guard) {
                guard.classList.remove('active', 'cursor-move', 'cursor-ew', 'cursor-ns', 'cursor-nwse');
            }
            document.body.classList.remove('window-interacting');
        }

        // Safety net: if the mouse is released outside the browser window (or the tab loses
        // focus) mid-drag/resize, the normal mouseup listener never fires. Without this, the
        // guard layer would stay up and silently block every future click. Cleanly cancel
        // whichever gesture is in progress as soon as we notice.
        window.addEventListener('blur', () => {
            if (activeDragElement) dragWindowStop();
            if (resizeState) stopResize();
        });

        function dragWindowStart(e, id) {
            // Only allow dragging with primary click
            if (e.button !== 0) return;

            // Don't start a drag if the press originated on the header's own controls
            // (minimize/maximize/close) — otherwise pressing those buttons would also
            // yank the window a few pixels and fire an accidental drag alongside the click.
            if (e.target.closest('.win-btn, .win-controls')) return;

            e.preventDefault();

            activeDragElement = document.getElementById(`win-${id}`);
            activeDragElement.classList.add('dragging');
            focusWindow(activeDragElement);
            beginWindowInteraction('move');
            
            dragOffsetX = e.clientX - activeDragElement.offsetLeft;
            dragOffsetY = e.clientY - activeDragElement.offsetTop;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            
            document.addEventListener('mousemove', dragWindowMove);
            document.addEventListener('mouseup', dragWindowStop);
        }

        function dragWindowMove(e) {
            if (!activeDragElement) return;
            
            let nextX = e.clientX - dragOffsetX;
            let nextY = e.clientY - dragOffsetY;
            
            // Calculate velocity coordinates
            let dx = e.clientX - lastMouseX;
            let dy = e.clientY - lastMouseY;
            
            // Calculate organic wobbly skew angles
            let skewX = dx * 0.45;
            let skewY = dy * 0.20;
            
            // Safe clamp thresholds to prevent extreme distortion
            skewX = Math.max(-18, Math.min(18, skewX));
            skewY = Math.max(-12, Math.min(12, skewY));
            
            // Simulated jelly squeeze
            let scaleOffset = Math.min(0.08, Math.abs(dx + dy) * 0.0035);
            let scaleX = 1 - scaleOffset;
            let scaleY = 1 + (scaleOffset * 0.5);

            activeDragElement.style.left = `${nextX}px`;
            activeDragElement.style.top = `${nextY}px`;
            activeDragElement.style.transform = `skewX(${skewX}deg) skewY(${skewY}deg) scale(${scaleX}, ${scaleY})`;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function dragWindowStop() {
            if (activeDragElement) {
                activeDragElement.classList.remove('dragging');
                // Snaps window transform smoothly back to pristine layout orientation
                activeDragElement.style.transform = 'none';
            }
            activeDragElement = null;
            document.removeEventListener('mousemove', dragWindowMove);
            document.removeEventListener('mouseup', dragWindowStop);
            endWindowInteraction();
        }

        // Window controls logic

        // Minimize just hides the window - it keeps running in the background (stays in activeWindows)
        // so clicking its dock icon again restores it exactly where it was, still loaded.
        function minimizeWindow(id) {
            const win = document.getElementById(`win-${id}`);
            if (!win) return;
            playUiSound('minimize');
            if (noBarsWindowId === id) {
                document.body.classList.remove('hide-chrome');
                noBarsWindowId = null;
            }
            win.classList.remove('animate-open');
            win.classList.add('animate-close');
            setTimeout(() => {
                win.style.display = 'none';
                win.classList.remove('animate-close');
                renderShelf();
            }, 240);
        }

        // Maximize behavior honors the 4 user-selectable modes from Appearance:
        //  - floating: leaves a visible margin around the maximized window, shrunk to fit around the dock
        //  - less-space: fills everything except the dock/panel real estate
        //  - fullscreen: window covers the entire page (dock/desktop stay in the DOM, on top)
        //  - fullscreen-no-bars: window covers the entire page AND the dock/panel/desktop icons are hidden
        function toggleMaximizeWindow(id) {
            const win = document.getElementById(`win-${id}`);
            const isMaximized = win.dataset.maximized === "true";
            playUiSound(isMaximized ? 'restore' : 'maximize');

            if (!isMaximized) {
                // Save previous positions so we can restore exactly
                win.dataset.prevWidth = win.style.width;
                win.dataset.prevHeight = win.style.height;
                win.dataset.prevTop = win.style.top;
                win.dataset.prevLeft = win.style.left;
                win.dataset.prevRadius = win.style.borderRadius;

                const mode = appearanceSettings.maximizeMode;
                win.dataset.maxMode = mode;
                win.style.transform = "none";

                if (mode === 'floating') {
                    // Leaves a margin on every side, but shrinks away from whichever
                    // edge the dock/panel occupies so it never sits underneath it.
                    const margin = 20;
                    const reserved = getDockReservedSpace();
                    const pos = appearanceSettings.dockPosition;
                    const extra = reserved - margin; // extra space to leave beyond the normal margin, on the dock's side

                    win.style.left = `${margin + (pos === 'left' ? extra : 0)}px`;
                    win.style.top = `${margin + (pos === 'top' ? extra : 0)}px`;
                    win.style.width = `calc(100vw - ${margin * 2}px - ${pos === 'left' || pos === 'right' ? extra : 0}px)`;
                    win.style.height = `calc(100vh - ${margin * 2}px - ${pos === 'top' || pos === 'bottom' ? extra : 0}px)`;
                } else if (mode === 'less-space') {
                    const reserved = getDockReservedSpace();
                    const pos = appearanceSettings.dockPosition;
                    win.style.left = pos === 'left' ? `${reserved}px` : '0px';
                    win.style.top = pos === 'top' ? `${reserved}px` : '0px';
                    win.style.width = (pos === 'left' || pos === 'right') ? `calc(100vw - ${reserved}px)` : '100vw';
                    win.style.height = (pos === 'top' || pos === 'bottom') ? `calc(100vh - ${reserved}px)` : '100vh';
                } else if (mode === 'fullscreen') {
                    win.style.left = '0px';
                    win.style.top = '0px';
                    win.style.width = '100vw';
                    win.style.height = '100vh';
                } else if (mode === 'fullscreen-no-bars') {
                    win.style.left = '0px';
                    win.style.top = '0px';
                    win.style.width = '100vw';
                    win.style.height = '100vh';
                    document.body.classList.add('hide-chrome');
                    noBarsWindowId = id;
                }

                // Optional: square off the window's corners while maximized, regardless
                // of the normal window-rounding setting.
                win.style.borderRadius = appearanceSettings.squareCornersMaximized ? '0px' : '';

                win.dataset.maximized = "true";
            } else {
                win.style.width = win.dataset.prevWidth || '700px';
                win.style.height = win.dataset.prevHeight || '480px';
                win.style.top = win.dataset.prevTop || '80px';
                win.style.left = win.dataset.prevLeft || '100px';
                win.style.borderRadius = win.dataset.prevRadius || '';

                if (win.dataset.maxMode === 'fullscreen-no-bars' && noBarsWindowId === id) {
                    document.body.classList.remove('hide-chrome');
                    noBarsWindowId = null;
                }

                win.dataset.maximized = "false";
                win.dataset.maxMode = "";
            }
        }

        // Tracks which window (if any) is currently in fullscreen-no-bars mode,
        // so closing/minimizing it correctly restores the dock and desktop icons.
        let noBarsWindowId = null;

        // Close fully terminates the app: the window element is destroyed, its state/iframe
        // is discarded, and it drops out of activeWindows entirely. Reopening it starts fresh.
        function closeWindow(id) {
            document.getElementById('context-menu').style.display = 'none';
            const win = document.getElementById(`win-${id}`);
            if (!win) return;
            playUiSound('close');
            if (noBarsWindowId === id) {
                document.body.classList.remove('hide-chrome');
                noBarsWindowId = null;
            }
            win.classList.remove('animate-open');
            win.classList.add('animate-close');
            setTimeout(() => {
                win.remove();
                delete activeWindows[id];
                renderShelf();
            }, 240);
        }

        // Window Resizing (drag corner/edge handles to resize, respecting min-width/min-height)
        let resizeState = null;

        function startResize(e, id, dir) {
            if (e.button !== 0) return;
            e.preventDefault();
            e.stopPropagation();

            const win = document.getElementById(`win-${id}`);
            if (!win) return;
            focusWindow(win);

            resizeState = {
                win,
                dir,
                startX: e.clientX,
                startY: e.clientY,
                startW: win.offsetWidth,
                startH: win.offsetHeight
            };

            win.classList.add('dragging'); // disable slow CSS transitions while actively resizing
            const cursorKind = dir === 'r' ? 'ew' : dir === 'b' ? 'ns' : 'nwse';
            beginWindowInteraction(cursorKind);
            document.addEventListener('mousemove', doResize);
            document.addEventListener('mouseup', stopResize);
        }

        function doResize(e) {
            if (!resizeState) return;
            const { win, dir, startX, startY, startW, startH } = resizeState;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (dir === 'r' || dir === 'br') {
                win.style.width = `${Math.max(320, startW + dx)}px`;
            }
            if (dir === 'b' || dir === 'br') {
                win.style.height = `${Math.max(240, startH + dy)}px`;
            }
        }

        function stopResize() {
            if (resizeState) {
                resizeState.win.classList.remove('dragging');
            }
            resizeState = null;
            document.removeEventListener('mousemove', doResize);
            document.removeEventListener('mouseup', stopResize);
            endWindowInteraction();
        }

        // File Manager Business Logic

        async function refreshFilesDisplay() {
            const grid = document.getElementById('files-grid');
            if (!grid) return;

            if (currentDirHandle) {
                try {
                    let count = 0;
                    for await (const entry of currentDirHandle.values()) {
                        if (entry.kind === 'file') {
                            const fileObj = await entry.getFile();
                            createFileVisualCard(grid, fileObj.name, fileObj.type, fileObj);

                    }
                    if (count === 0) {
                        grid.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs font-semibold">Directory is completely empty.</div>`;

                } catch(err) {
                    showVirtualStorage();

                    grid.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs font-semibold">Sandbox filesystem is empty. Create a file!</div>`;

        function createFileVisualCard(parentContainer, name, mimeType, fullRef, index = -1) {

            };

            let iconHtml = '<i data-lucide="file" class="w-10 h-10 text-gray-400"></i>';

            } else if (mimeType.includes('html') || name.endsWith('.html')) {
                iconHtml = '<i data-lucide="code-xml" class="w-10 h-10 text-indigo-500"></i>';

            card.innerHTML = `

        async function deleteVirtualFile(index) {
            if (index < 0) return;
            const confirmed = await systemConfirm("Are you sure you want to permanently delete this file?", "Delete File");
            if (confirmed) {
                const deletedName = virtualFileSystem[index].name;
                virtualFileSystem.splice(index, 1);
                localStorage.setItem('chromeos_vfs', JSON.stringify(virtualFileSystem));
                refreshFilesDisplay();
                refreshFileLockSelectOptions();
                showToast(`Deleted file "${deletedName}"`);
            }
        }

        function handleFileGridContextMenu(e) {
            if (e.target.id === 'files-grid') {
                e.preventDefault();
                const menu = document.getElementById('context-menu');
                menu.style.display = 'block';
                menu.style.left = `${e.clientX}px`;
                menu.style.top = `${e.clientY}px`;
                menu.innerHTML = `
                    <div class="context-menu-item" onclick="createNewFilePrompt()">
                        <i data-lucide="plus" class="w-3.5 h-3.5 text-blue-500"></i> Create File
                    </div>
                    <div class="context-menu-item" onclick="refreshFilesDisplay()">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-gray-500"></i> Refresh View
                    </div>
                `;
                lucide.createIcons();
            }
        }

        // Generic Open-In File App Handler Routing
        function handleFileOpenInApp(appId, fileContext) {
            switch(appId) {
                case 'preview':
                    const previewTitle = document.getElementById('preview-filename');
                    const previewView = document.getElementById('preview-viewport');
                    
                    if (previewTitle && previewView) {
                        previewTitle.innerText = fileContext.name;
                        
                        let fileContent = "";
                        if (fileContext.index !== -1) {
                            fileContent = virtualFileSystem[fileContext.index].content || "";
                        } else {
                            fileContent = fileContext.fullRef.content || "";
                        }

                        if (fileContext.mimeType.startsWith('image/')) {
                            previewView.innerHTML = `<img src="${fileContent}" class="max-w-full max-h-full rounded-none shadow-md border border-gray-200">`;
                        } else {
                            // Safe render text contents
                            previewView.innerHTML = `<pre class="w-full text-xs font-mono text-gray-700 bg-white p-4 border border-gray-200 rounded-none overflow-auto select-text">${escapeHtml(fileContent)}</pre>`;
                        }
                    }
                    break;

                case 'paint':
                    const canvas = document.getElementById('paint-canvas');
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        
                        let imgUrl = "";
                        if (fileContext.index !== -1) {
                            imgUrl = virtualFileSystem[fileContext.index].content || "";
                        } else {
                            imgUrl = fileContext.fullRef.content || "";
                        }

                        if (imgUrl) {
                            const img = new Image();
                            img.onload = () => {
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            };
                            img.src = imgUrl;
                        }
                        // Tag currently loaded file context
                        canvas.dataset.currentFileIndex = fileContext.index;
                        canvas.dataset.currentFileName = fileContext.name;
                    }
                    break;

                case 'texteditor':
                    const editorNameInput = document.getElementById('texteditor-filename');
                    const editorTextArea = document.getElementById('texteditor-content');
                    if (editorNameInput && editorTextArea) {
                        editorNameInput.value = fileContext.name;
                        
                        let content = "";
                        if (fileContext.index !== -1) {
                            content = virtualFileSystem[fileContext.index].content || "";
                        } else {
                            content = fileContext.fullRef.content || "";
                        }
                        
                        editorTextArea.value = content;
                        editorTextArea.dataset.currentFileIndex = fileContext.index;
                    }
                    break;

                case 'codeeditor':
                    const codeNameInput = document.getElementById('codeeditor-filename');
                    const codeTextArea = document.getElementById('codeeditor-content');
                    if (codeNameInput && codeTextArea) {
                        codeNameInput.value = fileContext.name;
                        
                        let content = "";
                        if (fileContext.index !== -1) {
                            content = virtualFileSystem[fileContext.index].content || "";
                        } else {
                            content = fileContext.fullRef.content || "";
                        }
                        
                        codeTextArea.value = content;
                        codeTextArea.dataset.currentFileIndex = fileContext.index;
                        refreshCodePreview();
                    }
                    break;
            }
        }

        // Image Paint Business Logic
        function initPaintAppLogic() {
            setTimeout(() => {
                const canvas = document.getElementById('paint-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let painting = false;

                const colorPicker = document.getElementById('paint-color');
                const sizeSlider = document.getElementById('paint-size');
                const sizeValueDisplay = document.getElementById('paint-size-text');
                const clearBtn = document.getElementById('paint-clear');
                const saveBtn = document.getElementById('paint-save');

                sizeSlider.oninput = () => {
                    sizeValueDisplay.innerText = `${sizeSlider.value}px`;
                };

                // Canvas line drawing styles
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                canvas.onmousedown = (e) => {
                    painting = true;
                    ctx.beginPath();
                    const rect = canvas.getBoundingClientRect();
                    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
                };

                canvas.onmousemove = (e) => {
                    if (!painting) return;
                    const rect = canvas.getBoundingClientRect();
                    ctx.strokeStyle = colorPicker.value;
                    ctx.lineWidth = sizeSlider.value;
                    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                    ctx.stroke();
                };

                canvas.onmouseup = () => { painting = false; };
                canvas.onmouseleave = () => { painting = false; };

                clearBtn.onclick = async () => {
                    const confirmed = await systemConfirm("Are you sure you want to clear your painting canvas?", "Clear Canvas");
                    if (confirmed) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                };

                saveBtn.onclick = async () => {
                    const dataUrl = canvas.toDataURL('image/png');
                    const activeIndex = canvas.dataset.currentFileIndex;
                    const activeName = canvas.dataset.currentFileName;

                    if (activeIndex !== undefined && activeIndex !== "-1" && activeIndex >= 0) {
                        virtualFileSystem[activeIndex].content = dataUrl;
                        showToast(`Canvas artwork "${activeName}" saved!`);
                    } else {
                        const requestedName = await systemPrompt("Save new drawing file as:", "MyPainting.png");
                        if (!requestedName) return;

                        virtualFileSystem.push({
                            name: requestedName.endsWith('.png') ? requestedName : `${requestedName}.png`,
                            type: 'image/png',
                            content: dataUrl
                        });
                        showToast(`New painting "${requestedName}" created!`);
                    }
                    localStorage.setItem('chromeos_vfs', JSON.stringify(virtualFileSystem));
                    refreshFilesDisplay();
                    refreshFileLockSelectOptions();
                };
            }, 100);
        }

        // Text Editor Business Logic
        function initTextEditorLogic() {
            setTimeout(() => {
                const saveBtn = document.getElementById('texteditor-save');
                if (!saveBtn) return;

                saveBtn.onclick = () => {
                    const name = document.getElementById('texteditor-filename').value.trim();
                    const content = document.getElementById('texteditor-content').value;
                    const index = document.getElementById('texteditor-content').dataset.currentFileIndex;

                    if (!name) {
                        showToast("Please specify a filename to save!");
                        return;
                    }

                    if (index !== undefined && index !== "-1" && index >= 0) {
                        virtualFileSystem[index].name = name;
                        virtualFileSystem[index].content = content;
                        showToast(`File "${name}" updated successfully.`);
                    } else {
                        virtualFileSystem.push({
                            name: name.endsWith('.txt') ? name : `${name}.txt`,
                            type: 'text/plain',
                            content: content
                        });
                        showToast(`Saved text file "${name}".`);
                    }
                    localStorage.setItem('chromeos_vfs', JSON.stringify(virtualFileSystem));
                    refreshFilesDisplay();
                    refreshFileLockSelectOptions();
                };
            }, 100);
        }

        // Code Editor Live Preview Logic
        function initCodeEditorLogic() {
            setTimeout(() => {
                const textarea = document.getElementById('codeeditor-content');
                const saveBtn = document.getElementById('codeeditor-save');

                if (!textarea) return;

                textarea.oninput = () => {
                    refreshCodePreview();
                };

                saveBtn.onclick = () => {
                    const name = document.getElementById('codeeditor-filename').value.trim();
                    const content = textarea.value;
                    const index = textarea.dataset.currentFileIndex;

                    if (!name) {
                        showToast("Please specify a filename to save!");
                        return;
                    }

                    if (index !== undefined && index !== "-1" && index >= 0) {
                        virtualFileSystem[index].name = name;
                        virtualFileSystem[index].content = content;
                        showToast(`Code file "${name}" updated successfully.`);
                    } else {
                        virtualFileSystem.push({
                            name: name.endsWith('.html') ? name : `${name}.html`,
                            type: 'text/html',
                            content: content
                        });
                        showToast(`Code saved as "${name}".`);
                    }
                    localStorage.setItem('chromeos_vfs', JSON.stringify(virtualFileSystem));
                    refreshFilesDisplay();
                    refreshFileLockSelectOptions();
                };
            }, 100);
        }

        function refreshCodePreview() {
            const codeVal = document.getElementById('codeeditor-content').value;
            const iframe = document.getElementById('codeeditor-preview');
            if (!iframe) return;

            const previewBlob = new Blob([codeVal], { type: 'text/html' });
            iframe.src = URL.createObjectURL(previewBlob);
        }

        // Encryption and File Lock Protection Panel Logic
        function refreshFileLockSelectOptions() {
            const select = document.getElementById('filelock-select');
            if (!select) return;

            select.innerHTML = '';
            virtualFileSystem.forEach((file, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${file.name} (${file.type})`;
                select.appendChild(opt);
            });
        }

        function handleEncryptFile() {
            const index = document.getElementById('filelock-select').value;
            const pwd = document.getElementById('filelock-pwd').value;
            const confirmPwd = document.getElementById('filelock-pwd-confirm').value;

            if (index === "" || index === undefined) {
                showToast("Please select a file to lock!");
                return;
            }
            if (!pwd) {
                showToast("Please specify a password!");
                return;
            }
            if (pwd !== confirmPwd) {
                showToast("Passwords do not match!");
                return;
            }

            const targetFile = virtualFileSystem[index];
            const encryptedPayload = btoa(encodeURIComponent(targetFile.content));
            
            targetFile.content = `LOCKED_VFS_FILE:${pwd}:${encryptedPayload}`;
            targetFile.name = targetFile.name.endsWith('.lock') ? targetFile.name : `${targetFile.name}.lock`;
            
            localStorage.setItem('chromeos_vfs', JSON.stringify(virtualFileSystem));
            
            document.getElementById('filelock-pwd').value = '';
            document.getElementById('filelock-pwd-confirm').value = '';

            showToast(`File "${targetFile.name}" password protected successfully!`);
            refreshFilesDisplay();
            refreshFileLockSelectOptions();
        }

        function handleDecryptFile() {
            const index = document.getElementById('filelock-select').value;
            const pwd = document.getElementById('filelock-pwd').value;

            if (index === "" || index === undefined) {
                showToast("Please select a file to unlock!");
                return;
            }
            if (!pwd) {
                showToast("Please enter the decryption password!");
                return;
            }

            const targetFile = virtualFileSystem[index];
            const contentStr = targetFile.content;

            if (!contentStr.startsWith("LOCKED_VFS_FILE:")) {
                showToast("This file is not currently locked!");
                return;
            }

            const parts = contentStr.split(':');
            const storedPwd = parts[1];
            const payload = parts[2];

            if (pwd !== storedPwd) {
                showToast("Incorrect password! Decryption failed.");
                return;
            }

            try {
                const decryptedContent = decodeURIComponent(atob(payload));
                targetFile.content = decryptedContent;
                targetFile.name = targetFile.name.replace('.lock', '');
                
                localStorage.setItem('chromeos_vfs', JSON.stringify(virtualFileSystem));
                
                document.getElementById('filelock-pwd').value = '';
                document.getElementById('filelock-pwd-confirm').value = '';

                showToast(`File unlocked! Restored to "${targetFile.name}".`);
                refreshFilesDisplay();
                refreshFileLockSelectOptions();
            } catch(e) {
                showToast("Decryption failed. The locked payload may be corrupted.");
            }
        }

        // Global Utility Helpers
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function openSystemStatus() {
            showToast(`VFS Files count: ${virtualFileSystem.length} | Registered Custom Apps: ${installedCustomApps.length}`);
        }
