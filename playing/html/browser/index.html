<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Rotator</title>
<style>
  :root {
    --bg: #101214;
    --panel: #17191c;
    --line: #2a2d31;
    --text: #e7e9ea;
    --dim: #8a9096;
    --ok: #4caf7d;
    --bad: #d97757;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Full-viewport iframe once a working link is found */
  #targetFrame {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
    display: none;
    background: #000;
  }

  /* Placeholder / status overlay shown while checking */
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 26px;
  }
  #spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #headline {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  #sub {
    font-size: 13px;
    color: var(--dim);
    margin: 0 0 18px;
  }

  #log {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12.5px;
    max-height: 240px;
    overflow-y: auto;
  }
  #log li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.02);
  }
  .dot {
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
  }
  .dot.pending { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .url {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--dim);
  }
  .reason {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--dim);
  }

  #failState {
    display: none;
    margin-top: 16px;
    font-size: 13px;
    color: var(--bad);
  }
</style>
</head>
<body>

  <!-- Placeholder shown while cycling through links -->
  <div id="status">
    <div id="card">
      <div id="spinner"></div>
      <p id="headline">Finding a working browser...</p>
      <p id="sub">Note in the browser when you click anywhere and a new tab opens hold CTRL then press W to go back</p>
      <ul id="log"></ul>
      <p id="failState">No working link was found. All candidates failed or redirected off-domain.</p>
    </div>
  </div>

  <!-- Final destination, takes over the whole viewport -->
  <iframe id="targetFrame" title="Loaded content" allow="fullscreen"></iframe>

<script>
(function () {
  // ---- Configure your candidate links here, in priority order ----
  const CANDIDATES = [
    "https://quizizz.com/_media/dogeub/d8a21003-0070-4c16-9b21-5352c850536d-v2"
  ];

  const PER_LINK_TIMEOUT_MS = 6000;

  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const frameEl = document.getElementById("targetFrame");
  const headlineEl = document.getElementById("headline");
  const subEl = document.getElementById("sub");
  const failEl = document.getElementById("failState");

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch (e) { return null; }
  }

  function addRow(url) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="dot pending"></span><span class="url">${url}</span><span class="reason">checking…</span>`;
    logEl.appendChild(li);
    return {
      setOk(reason) {
        li.querySelector(".dot").className = "dot ok";
        li.querySelector(".reason").textContent = reason || "ok";
      },
      setBad(reason) {
        li.querySelector(".dot").className = "dot bad";
        li.querySelector(".reason").textContent = reason || "skipped";
      }
    };
  }

  function withTimeout(promise, ms) {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error("timeout")), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }

  // Attempt 1: fetch in 'cors' mode. Works only if the target sends CORS
  // headers, but when it does we get a reliable response.url / response.redirected.
  async function checkViaCorsFetch(url) {
    const res = await fetch(url, { method: "GET", mode: "cors", redirect: "follow", cache: "no-store" });
    const finalHost = hostOf(res.url || url);
    const startHost = hostOf(url);
    if (!res.ok) throw new Error("http-" + res.status);
    if (finalHost && startHost && finalHost !== startHost) {
      const err = new Error("redirected-off-domain");
      err.finalHost = finalHost;
      throw err;
    }
    return { finalHost };
  }

  // Attempt 2: fetch in 'no-cors' mode as a reachability probe. This can't see
  // the final URL (opaque response) so it can't detect cross-domain redirects,
  // it only tells us "something responded, no network-level failure."
  async function checkViaNoCorsFetch(url) {
    await fetch(url, { method: "HEAD", mode: "no-cors", redirect: "follow", cache: "no-store" });
    return { finalHost: null, opaque: true };
  }

  // Attempt 3: try loading it directly in a throwaway iframe and see whether
  // it fires 'load' before the timeout. This is the closest thing to "does it
  // actually render," but same-origin policy still blocks reading its final URL.
  function checkViaIframeLoad(url) {
    return new Promise((resolve, reject) => {
      const probe = document.createElement("iframe");
      probe.style.display = "none";
      let done = false;

      const cleanup = () => {
        if (probe.parentNode) probe.parentNode.removeChild(probe);
      };

      probe.onload = () => {
        if (done) return;
        done = true;
        cleanup();
        resolve({ finalHost: null, viaIframe: true });
      };
      probe.onerror = () => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("iframe-error"));
      };

      probe.src = url;
      document.body.appendChild(probe);
    });
  }

  // Runs the checks in order of reliability, falling through as each fails.
  async function checkLink(url) {
    try {
      return await withTimeout(checkViaCorsFetch(url), PER_LINK_TIMEOUT_MS);
    } catch (e1) {
      if (e1.message === "redirected-off-domain") throw e1; // definitive skip, don't fall through
      try {
        return await withTimeout(checkViaNoCorsFetch(url), PER_LINK_TIMEOUT_MS);
      } catch (e2) {
        return await withTimeout(checkViaIframeLoad(url), PER_LINK_TIMEOUT_MS);
      }
    }
  }

  function loadFinal(url) {
    statusEl.style.display = "none";
    frameEl.src = url;
    frameEl.style.display = "block";
  }

  async function run() {
    for (const url of CANDIDATES) {
      const row = addRow(url);
      headlineEl.textContent = "Checking " + (hostOf(url) || url) + "…";
      try {
        await checkLink(url);
        row.setOk("reachable");
        subEl.textContent = "Loading…";
        loadFinal(url);
        return;
      } catch (err) {
        if (err && err.message === "redirected-off-domain") {
          row.setBad("redirected → " + (err.finalHost || "different domain"));
        } else {
          row.setBad("unreachable");
        }
      }
    }
    headlineEl.textContent = "No link is currently working";
    subEl.textContent = "";
    failEl.style.display = "block";
    document.getElementById("spinner").style.display = "none";
  }

  run();
})();
</script>
</body>
</html>
