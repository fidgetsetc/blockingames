<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen SVG Canvas</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050714;
        }
        object {
            width: 100vw;
            height: 100vh;
            display: block;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Replace the data attribute with your SVG link. <object> supports foreignObject, scripts, and embedded HTML -->
    <object data="https://cdn.jsdelivr.net/gh/dogeub/-/index.svg" type="image/svg+xml" title="Full Screen SVG"></object>
</body>
</html>
