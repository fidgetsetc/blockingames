<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reassembled HTML Document</title>
    <script>
        const PARTS_COUNT = 20;
        const PART_FILES = Array.from({ length: PARTS_COUNT }, (_, i) => `https://cdn.jsdelivr.net/gh/fidgetsetc/blockingames@main/playing/html/spr/part_${i}.txt`);

        async function reassemblePage() {
            try {
                // Fetch all text parts asynchronously in parallel
                const fetchPromises = PART_FILES.map(file => 
                    fetch(file).then(res => {
                        if (!res.ok) throw new Error('Failed to load ' + file);
                        return res.text();
                    })
                );

                const partsContent = await Promise.all(fetchPromises);
                const fullHTML = partsContent.join('');

                // Overwrite document with stitched HTML
                document.open();
                document.write(fullHTML);
                document.close();
            } catch (err) {
                document.body.innerHTML = `
                    <div style="font-family:sans-serif; padding:40px; color:#f87171; background:#0f172a; min-height:100vh;">
                        <h2>Error Reassembling HTML</h2>
                        <p>${err.message}</p>
                        <small style="color:#94a3b8;">Note: Fetch requires running on a local web server (e.g. http://localhost) to bypass local file CORS security.</small>
                    </div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', reassemblePage);
    </script>
</head>
<body style="font-family:sans-serif; background:#0f172a; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div style="text-align:center;">
        <h3>Fetching & Reassembling HTML Parts...</h3>
    </div>
</body>
</html>
