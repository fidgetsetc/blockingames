<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>playtube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Header */
        #yt-header {
            height: 56px;
            background: #0f0f0f;
            border-bottom: 1px solid #272727;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            flex-shrink: 0;
            z-index: 100;
        }
        #yt-logo {
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            margin-right: 8px;
            cursor: pointer;
        }
        #yt-logo .logo-icon {
            background: #ff0000;
            border-radius: 6px;
            width: 34px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #yt-logo .logo-icon i { color: white; font-size: 12px; }
        #yt-logo .logo-text { font-size: 18px; font-weight: 700; color: #f1f1f1; letter-spacing: -0.5px; }
        #yt-logo .logo-text span { color: #aaa; font-weight: 400; font-size: 11px; vertical-align: super; margin-left: 1px; }

        /* Search bar */
        #search-form {
            flex: 1;
            max-width: 600px;
            display: flex;
            margin: 0 auto;
        }
        #search-input {
            flex: 1;
            background: #121212;
            border: 1px solid #303030;
            border-right: none;
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            height: 40px;
            color: #f1f1f1;
            font-size: 16px;
            outline: none;
        }
        #search-input:focus { border-color: #1c62b9; }
        #search-input::placeholder { color: #717171; }
        #search-btn {
            background: #222;
            border: 1px solid #303030;
            border-radius: 0 40px 40px 0;
            width: 64px;
            height: 40px;
            color: #f1f1f1;
            cursor: pointer;
            font-size: 16px;
        }
        #search-btn:hover { background: #333; }

        /* Header right icons */
        .hdr-icon-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: none;
            border: none;
            color: #f1f1f1;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hdr-icon-btn:hover { background: #272727; }
        .hdr-icon-btn:disabled { opacity: .3; cursor: default; background: none; }

        /* Layout */
        #app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 240px;
            background: #0f0f0f;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 12px 0;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 12px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #f1f1f1;
            margin: 2px 8px;
        }
        .sidebar-item:hover { background: #272727; }
        .sidebar-item.active { background: #272727; }
        .sidebar-item i { width: 24px; text-align: center; font-size: 18px; }
        .sidebar-divider { border: none; border-top: 1px solid #272727; margin: 12px 0; }
        .sidebar-section-label {
            padding: 8px 20px 4px;
            font-size: 14px;
            font-weight: 600;
            color: #f1f1f1;
        }

        /* Main content */
        #main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 40px;
        }

        /* Video grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px 16px;
        }
        .video-card {
            cursor: pointer;
        }
        .video-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #272727;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .video-thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: border-radius 0.2s;
        }
        .video-card:hover .video-thumb img { border-radius: 0; }
        .video-meta { padding: 12px 0 0; display: flex; gap: 12px; }
        .video-meta-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #3f3f3f;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #aaa;
            overflow: hidden;
        }
        .video-meta-info { flex: 1; min-width: 0; }
        .video-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #f1f1f1;
            margin-bottom: 4px;
        }
        .video-channel {
            font-size: 13px;
            color: #aaa;
        }

        /* Chips / filter bar */
        .chips-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .chips-bar::-webkit-scrollbar { display: none; }
        .chip {
            background: #272727;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            height: 32px;
            font-size: 14px;
            color: #f1f1f1;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Roboto', sans-serif;
        }
        .chip:hover { background: #3f3f3f; }
        .chip.active { background: #f1f1f1; color: #0f0f0f; font-weight: 500; }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #272727 25%, #333 50%, #272727 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Fade in */
        .fade-in { animation: fadeIn 0.25s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Player page */
        #player-page { display: flex; gap: 24px; }
        #player-main { flex: 1; min-width: 0; }
        #player-sidebar { width: 402px; flex-shrink: 0; }
        .player-title { font-size: 20px; font-weight: 700; margin: 12px 0 8px; line-height: 1.4; }
        .player-channel { font-size: 15px; color: #aaa; margin-bottom: 16px; }
        #player-sidebar h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; border-bottom: 1px solid #272727; padding-bottom: 10px; }

        /* Method selector in player sidebar */
        .method-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .method-option:hover { background: #1a1a1a; }
        .method-option.selected { background: #1a1a1a; }
        .method-radio {
            width: 18px; height: 18px;
            border-radius: 50%;
            border: 2px solid #aaa;
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .method-option.selected .method-radio { border-color: #3ea6ff; }
        .method-option.selected .method-radio::after {
            content: '';
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #3ea6ff;
        }
        .method-label { font-size: 14px; font-weight: 500; }
        .method-desc { font-size: 12px; color: #aaa; margin-top: 2px; }

        /* Custom player */
        .ytcp { font-family: 'Roboto', sans-serif; }
        .ytcp-hidden { display: none !important; }
        .ytcp-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 3; }
        .ytcp-bigplay { width: 68px; height: 68px; border-radius: 50%; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
        .ytcp-error { background: rgba(0,0,0,.85); pointer-events: auto; flex-direction: column; gap: 14px; text-align: center; padding: 24px; z-index: 6; }
        .ytcp-error button { background: #3ea6ff; color: #0f0f0f; padding: 8px 20px; border-radius: 20px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; }
        .ytcp-error button:hover { background: #65b8ff; }
        .ytcp-controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 12px 8px; background: linear-gradient(to top, rgba(0,0,0,.9), transparent); transition: opacity .25s; z-index: 5; }
        .ytcp.hide-controls .ytcp-controls { opacity: 0; pointer-events: none; }
        .ytcp.hide-controls { cursor: none; }
        .ytcp-progress { position: relative; height: 18px; display: flex; align-items: center; cursor: pointer; touch-action: none; margin-bottom: 4px; }
        .ytcp-track { position: relative; width: 100%; height: 3px; background: rgba(255,255,255,.2); border-radius: 2px; transition: height .1s; }
        .ytcp-progress:hover .ytcp-track, .ytcp-progress.dragging .ytcp-track { height: 5px; }
        .ytcp-buffered, .ytcp-played { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; }
        .ytcp-buffered { background: rgba(255,255,255,.4); }
        .ytcp-played { background: #ff0000; }
        .ytcp-thumb { position: absolute; top: 50%; left: 0; width: 13px; height: 13px; margin-left: -6px; margin-top: -6.5px; border-radius: 50%; background: #ff0000; transform: scale(0); transition: transform .1s; pointer-events: none; }
        .ytcp-progress:hover .ytcp-thumb, .ytcp-progress.dragging .ytcp-thumb { transform: scale(1); }
        .ytcp-row { display: flex; align-items: center; gap: 4px; color: #fff; }
        .ytcp-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #fff; background: none; border: none; cursor: pointer; font-size: 18px; border-radius: 4px; }
        .ytcp-btn:hover { background: rgba(255,255,255,.1); }
        .ytcp-time { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 4px; color: #eee; }
        .ytcp-badge { font-size: 11px; border: 1px solid rgba(255,255,255,.5); border-radius: 3px; padding: 0 4px; color: #eee; }
        .ytcp-vol { width: 80px; accent-color: #fff; cursor: pointer; }
        #yt-custom-player:fullscreen, #yt-custom-player:-webkit-full-screen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }

        /* Settings page */
        .settings-section { margin-bottom: 32px; }
        .settings-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
        .settings-sub { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #f1f1f1; }
        .settings-desc { font-size: 13px; color: #aaa; margin-bottom: 16px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #272727;
            border-radius: 20px;
            padding: 4px 12px 4px 14px;
            font-size: 13px;
            color: #f1f1f1;
        }
        .tag-pill button {
            background: none; border: none; color: #aaa;
            cursor: pointer; padding: 0; font-size: 12px; line-height: 1;
        }
        .tag-pill button:hover { color: #f1f1f1; }
        .tag-pill.default-tag { background: #1a3a5c; color: #3ea6ff; }
        .tag-input-row { display: flex; gap: 8px; }
        .tag-input {
            background: #121212;
            border: 1px solid #303030;
            border-radius: 4px;
            padding: 8px 12px;
            color: #f1f1f1;
            font-size: 14px;
            outline: none;
            width: 240px;
        }
        .tag-input:focus { border-color: #3ea6ff; }
        .yt-btn {
            background: #3ea6ff;
            color: #0f0f0f;
            border: none;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
        }
        .yt-btn:hover { background: #65b8ff; }
        .yt-btn-ghost {
            background: none;
            color: #3ea6ff;
            border: 1px solid #3ea6ff;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
        }
        .yt-btn-ghost:hover { background: rgba(62,166,255,.1); }

        /* Clock */
        #clock-display { font-size: 13px; color: #aaa; margin-left: auto; padding-right: 4px; }

        /* Saved badge in sidebar */
        .nav-badge { margin-left: auto; font-size: 11px; background: #272727; color: #ddd; border-radius: 8px; padding: 1px 7px; }

        /* Save-for-offline section */
        .save-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid #272727; margin-bottom: 8px; cursor: pointer; }
        .save-row:hover { background: #1a1a1a; }
        .save-row.disabled { cursor: default; }
        .save-row.disabled:hover { background: none; }
        .save-row .save-icon { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #666; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; }
        .save-row.saved .save-icon { border-color: #3ea6ff; background: #1a3a5c; }
        .save-note { font-size: 12px; color: #666; margin-top: 4px; }

        /* ── Shorts ── */
        #shorts-holder { position: fixed; left: -9999px; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; overflow: hidden; }
        #shorts-root { position: absolute; inset: 0; background: #0f0f0f; }
        #shorts-scroller {
            height: 100%; overflow-y: scroll; overflow-x: hidden;
            scroll-snap-type: y mandatory; overflow-anchor: none;
            scrollbar-width: none; overscroll-behavior: contain;
        }
        #shorts-scroller::-webkit-scrollbar { display: none; }
        .short-slide {
            height: 100%; width: 100%;
            scroll-snap-align: start; scroll-snap-stop: always; container-type: size;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .short-card {
            position: relative; height: calc(100% - 28px); height: min(calc(100cqh - 28px), calc(100cqw * 16 / 9 - 14px)); aspect-ratio: 9 / 16; max-width: calc(100% - 16px);
            background: #000; border-radius: 16px; overflow: hidden; cursor: pointer;
            box-shadow: 0 4px 24px rgba(0,0,0,.5);
        }
        .short-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
        .short-gradient { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(to top, rgba(0,0,0,.8), transparent); pointer-events: none; z-index: 2; }
        .short-info { position: absolute; left: 14px; right: 14px; bottom: 18px; z-index: 3; pointer-events: none; }
        .short-ch { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .short-av { width: 32px; height: 32px; border-radius: 50%; background: #3f3f3f; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #ddd; flex-shrink: 0; }
        .short-title { font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
        .short-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; display: flex; align-items: flex-end; z-index: 4; cursor: pointer; }
        .short-bar::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.25); }
        .short-fill { position: relative; height: 3px; width: 0; background: #ff0000; }
        .short-mute { position: absolute; top: 12px; right: 12px; z-index: 5; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(0,0,0,.5); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .short-mute:hover { background: rgba(0,0,0,.75); }
        .short-spin { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 3; pointer-events: none; font-size: 40px; color: #fff; }
        .short-spin.on { display: flex; }
        .short-flash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3; pointer-events: none; opacity: 0; font-size: 26px; color: #fff; }
        .short-flash i { width: 68px; height: 68px; border-radius: 50%; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
        .short-flash.on { animation: shortFlash .6s ease forwards; }
        @keyframes shortFlash { 0% { opacity: 1; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.25); } }
        .short-err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(0,0,0,.8); z-index: 6; font-size: 14px; color: #ddd; }
        .short-err.on { display: flex; }
        .short-endmsg { display: flex; flex-direction: column; align-items: center; gap: 14px; color: #aaa; font-size: 15px; text-align: center; }
        .short-endmsg > i { font-size: 36px; color: #3ea6ff; }
        .shorts-nav { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .shorts-nav button { width: 48px; height: 48px; border-radius: 50%; border: none; background: #272727; color: #f1f1f1; font-size: 18px; cursor: pointer; }
        .shorts-nav button:hover { background: #3f3f3f; }
        @media (max-width: 800px) { .shorts-nav { display: none; } }

        /* ── Channels / playlists ── */
        .link { cursor: pointer; }
        .video-channel.link:hover, .player-channel.link:hover { color: #f1f1f1; text-decoration: underline; }
        .thumb-len { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 500; padding: 1px 5px; border-radius: 4px; }
        .card-add { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,.7); color: #fff; cursor: pointer; opacity: 0; transition: opacity .15s; font-size: 13px; }
        .video-card:hover .card-add { opacity: 1; }
        .card-add:hover { background: rgba(0,0,0,.95); }
        @media (hover: none) { .card-add { opacity: 1; } }
        .empty-note { color: #aaa; font-size: 14px; padding: 16px 0; }
        .list-col { display: flex; flex-direction: column; gap: 8px; max-width: 900px; }
        .ch-row { display: flex; align-items: center; gap: 24px; padding: 12px; border-radius: 12px; cursor: pointer; }
        .ch-row:hover { background: #1a1a1a; }
        .ch-avatar-lg { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; background: #272727; flex-shrink: 0; }
        .ch-avatar-xl { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; background: #272727; flex-shrink: 0; }
        .ch-name { font-size: 18px; font-weight: 500; }
        .ch-sub { font-size: 13px; color: #aaa; margin-top: 4px; }
        .ch-desc { font-size: 13px; color: #aaa; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ch-banner { width: 100%; max-height: 180px; object-fit: cover; border-radius: 16px; margin-bottom: 20px; display: block; }
        .ch-head { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
        .ch-title { font-size: 28px; font-weight: 700; }
        .ch-tabs { border-bottom: 1px solid #272727; padding-bottom: 12px; margin-bottom: 20px; }
        .ch-about { max-width: 720px; font-size: 14px; line-height: 1.6; color: #ddd; }
        .ch-about .ch-sub { margin-top: 16px; }
        .center-spin { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 260px; gap: 16px; color: #aaa; }
        .center-spin i { font-size: 36px; color: #3ea6ff; }
        .pl-head { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .pl-row { display: flex; gap: 14px; align-items: center; padding: 8px; border-radius: 10px; cursor: pointer; max-width: 900px; }
        .pl-row:hover { background: #1a1a1a; }
        .pl-row .pl-n { width: 24px; text-align: center; color: #aaa; font-size: 13px; flex-shrink: 0; }
        .pl-row .pl-thumb { position: relative; width: 168px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #272727; flex-shrink: 0; }
        .pl-row .pl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .pl-row .pl-info { flex: 1; min-width: 0; }
        .pl-row .pl-title { font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .pl-row .pl-ch { font-size: 12px; color: #aaa; margin-top: 4px; }
        .pl-tools { display: flex; gap: 2px; flex-shrink: 0; }
        .pl-tools button { width: 32px; height: 32px; border-radius: 50%; border: none; background: none; color: #aaa; cursor: pointer; }
        .pl-tools button:hover { background: #272727; color: #fff; }
        .queue { max-height: 340px; overflow-y: auto; border: 1px solid #272727; border-radius: 8px; }
        .queue-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; font-size: 13px; }
        .queue-row:hover { background: #1a1a1a; }

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {

// Feed queries stored in localStorage so they persist
function loadFeedQueries() {
    try { return JSON.parse(localStorage.getItem('yyt_feed_queries') || 'null'); } catch { return null; }
}
function saveFeedQueries(q) {
    try { localStorage.setItem('yyt_feed_queries', JSON.stringify(q)); } catch {}
}

const db = { feed: [], search: [] };

// ─── Proxy ────────────────────────────────────────────────────────────────────
const PROXY = 'https://swp.scrappywriter.workers.dev/?url=';
function proxied(url) {
    if (url.startsWith('http://')) return PROXY + encodeURIComponent(url);
    return url;
}
// Downloading a video's actual bytes (for saving) always needs a response we can read in JS,
// which needs CORS — so always route it through the proxy, even for https instances.
function proxiedForFetch(url) {
    return PROXY + encodeURIComponent(url);
}

// ─── Saved videos (local only — no download/export path exists anywhere) ──────
// The video's own bytes are fetched once and kept in IndexedDB as blobs, keyed by "<id>_<quality>".
// Playback reads those blobs back into object URLs; there is no link, button, or code path that ever
// hands the blob or its URL to anything outside this page (no <a download>, no window.open, no export).
const IDB_NAME = 'yoyletube_saved', IDB_VERSION = 1, IDB_STORE = 'videos';
function idbOpen() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE, { keyPath: 'key' }); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function idbPut(record) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(record);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}
async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
    });
}
async function idbDelete(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}
// Lightweight metadata list (no blobs) kept in localStorage so the Saved page can render instantly
// without pulling every stored video's bytes into memory just to list them.
function loadSavedMeta() { try { return JSON.parse(localStorage.getItem('yyt_saved_meta') || '[]'); } catch { return []; } }
function persistSavedMeta() { try { localStorage.setItem('yyt_saved_meta', JSON.stringify(savedMeta)); } catch {} }
let savedMeta = loadSavedMeta();
let saveInProgress = null; // the "<id>_<quality>" key currently downloading, or null

// Only two qualities are ever offered or stored: 720p (itags 136+140, synced the same way the
// live "manual merged" player does it) and 360p (itag 18, a single pre-merged stream).
const SAVE_ITAGS = { '720p': { video: 136, audio: 140 }, '360p': { video: 18, audio: null } };

async function fetchBlobWithFallback(id, itag, instances) {
    let lastErr;
    for (const base of instances) {
        try {
            const url = proxiedForFetch(`${base}/latest_version?id=${id}&itag=${itag}&local=true`);
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 45000);
            let res;
            try { res = await fetch(url, { signal: ctrl.signal }); } finally { clearTimeout(timer); }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const blob = await res.blob();
            if (!blob || blob.size < 1024) throw new Error('Empty response');
            return blob;
        } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('All servers failed');
}

async function saveVideoQuality(item, quality) {
    const key = item.id + '_' + quality;
    if (saveInProgress || savedMeta.some(m => m.key === key)) return;
    saveInProgress = key;
    render();
    try {
        const instances = getMediaInstances();
        const itags = SAVE_ITAGS[quality];
        const videoBlob = await fetchBlobWithFallback(item.id, itags.video, instances);
        const audioBlob = itags.audio ? await fetchBlobWithFallback(item.id, itags.audio, instances) : null;
        await idbPut({ key, id: item.id, quality, title: item.title, channel: item.channel, videoBlob, audioBlob });
        savedMeta = [{ key, id: item.id, quality, title: item.title, channel: item.channel,
                        savedAt: Date.now(), size: videoBlob.size + (audioBlob ? audioBlob.size : 0) },
                      ...savedMeta.filter(m => m.key !== key)];
        persistSavedMeta();
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        toastMsg('Saved ' + quality + ' for offline viewing');
    } catch (e) {
        toastMsg("Couldn't save that video — try again");
    }
    saveInProgress = null;
    render();
}
async function removeSaved(key) {
    try { await idbDelete(key); } catch {}
    savedMeta = savedMeta.filter(m => m.key !== key);
    persistSavedMeta();
    render();
}
async function playSaved(key) {
    state.view = 'savedPlayer';
    state.savedLoading = true;
    state.savedRecord = null;
    setNavActive('nav-saved');

    try { state.savedRecord = await idbGet(key); } catch { state.savedRecord = null; }

}

const FALLBACK_INSTANCES = [

let instanceCache = null;

function fetchJSON(url, timeoutMs = 7000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    return fetch(url, { signal: ctrl.signal })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .finally(() => clearTimeout(timer));
}

async function getInstances() {
    if (instanceCache) return instanceCache;
    let httpsInstances = [];
    try {
        const data = await fetchJSON('https://api.invidious.io/instances.json?sort_by=type,health', 6000);
        httpsInstances = data
            .filter(([, info]) => info.api === true && info.cors === true && info.type === 'https')
            .map(([, info]) => info.uri.replace(/\/$/, ''));
    } catch (e) { console.warn('Instance list unavailable, using fallbacks'); }
    instanceCache = [...new Set([...httpsInstances.slice(0, 6), ...FALLBACK_INSTANCES])];
    return instanceCache;
}

async function searchInvidious(query, opts = {}) {
    let path = `/api/v1/search?q=${encodeURIComponent(query)}&type=${opts.type || 'video'}`;
    if (opts.page > 1) path += `&page=${opts.page}`;
    if (opts.duration) path += `&duration=${opts.duration}`;
    const instances = await getInstances();
    const all = [...new Set([...instances, ...[...FALLBACK_INSTANCES].sort(() => Math.random() - 0.5)])];
    const attempt = base => {
        const url = proxied(base + path);
        return fetchJSON(url, 8000).then(data => {
            if (!Array.isArray(data)) throw new Error('Bad response');
            state.ytInstance = base;
            return data;
        });
    };
    for (let i = 0; i < all.length; i += 6) {
        try { return await Promise.any(all.slice(i, i + 6).map(attempt)); } catch {}
    }
    throw new Error('All Invidious instances failed');
}

// Generic Invidious JSON fetch (channels, playlists, ...) with the same instance fallback as search.
async function invidiousJSON(path) {
    const instances = await getInstances();
    const all = [...new Set([...instances, ...[...FALLBACK_INSTANCES].sort(() => Math.random() - 0.5)])];
    const attempt = base => fetchJSON(proxied(base + path), 9000).then(data => {
        if (!data || data.error) throw new Error('Bad response');
        state.ytInstance = base;
        return data;
    });
    for (let i = 0; i < all.length; i += 6) {
        try { return await Promise.any(all.slice(i, i + 6).map(attempt)); } catch {}
    }
    throw new Error('All Invidious instances failed');
}

function mediaUrl(base, id, itag) {
    return proxied(`${base}/latest_version?id=${id}&itag=${itag}&local=true`);
}

function getMediaInstances() {
    const winner = state.ytInstance;
    const rest = (instanceCache || []).filter(i => i !== winner);
    const extra = FALLBACK_INSTANCES.filter(i => i !== winner && !(instanceCache || []).includes(i));
    return [winner, ...rest, ...extra];
}

// ─── Clock ────────────────────────────────────────────────────────────────────
function updateClock() {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes();

    document.getElementById('clock-display').textContent = `${h}:${m < 10 ? '0' + m : m} ${ap}`;

setInterval(updateClock, 1000);
updateClock();

function goHome() {

}

}
function goSettings() {

}
function goSaved() {
    state.view = 'saved';
    setNavActive('nav-saved');
    render();
}

// ─── Feed ──────────────────────────────────────────────────────────────────────
async function loadFeed() {
    state.feedLoading = true;
    render();
    // Pick a random query from the feed list
    const query = feedQueries[Math.floor(Math.random() * feedQueries.length)] || 'youtube';
    try {
        const data = await searchInvidious(query);
        const videos = Array.isArray(data)
            ? data.filter(v => v.type === 'video').map(v => mkItem(v))
            : [];
        // Shuffle so it feels like a real mixed feed
        db.feed = videos.sort(() => Math.random() - 0.5);
    } catch (e) {
        db.feed = [];
    }
    state.feedLoading = false;
    render();
}

// ─── Search ───────────────────────────────────────────────────────────────────
function handleSearch(e) {
    if (e.key === 'Enter') triggerSearch();
}
async function triggerSearch() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;
    state.searchQuery = query;
    state.searchType = 'video';
    db.searchRes = {};
    state.view = 'search';
    setNavActive('');
    await fetchSearchType('video');
}
async function fetchSearchType(type) {
    const q = state.searchQuery;
    state.isLoading = true;
    render();
    let list;
    try {
        const data = await searchInvidious(q, { type });
        list = Array.isArray(data) ? data.filter(v => v.type === type) : [];
    } catch { list = null; }
    if (q !== state.searchQuery || type !== state.searchType) return;
    db.searchRes[type] = list;
    state.isLoading = false;
    render();
}
function setSearchType(t) {
    if (state.searchType === t) return;
    state.searchType = t;
    if (db.searchRes[t] === undefined) fetchSearchType(t); else render();
}

function selectItem(item, keepPlaylist) {
    if (!keepPlaylist) state.playlistCtx = null;
    itemReg[item.id] = item;
    state.selectedItem = item;
    state.view = 'player';
    setNavActive('');
    render();
}
function setYTMethod(method) {
    state.ytMethod = method;
    render();
}

// ─── Settings helpers ─────────────────────────────────────────────────────────
function addFeedQuery() {
    const input = document.getElementById('new-query-input');
    const val = input.value.trim().toLowerCase();
    if (!val || feedQueries.includes(val)) { input.value = ''; return; }
    feedQueries.push(val);
    saveFeedQueries(feedQueries);
    db.feed = []; // reset so next home visit reloads
    render();
    input.value = '';
}
function removeFeedQuery(q) {
    if (q === 'youtube' && feedQueries.length === 1) return; // always keep at least one
    feedQueries = feedQueries.filter(x => x !== q);
    if (feedQueries.length === 0) feedQueries = ['youtube'];
    saveFeedQueries(feedQueries);
    db.feed = [];
    render();
}
function resetFeedQueries() {
    feedQueries = ['youtube'];
    saveFeedQueries(feedQueries);
    db.feed = [];
    render();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
    // Record the page we're leaving so the Back button can return to it.
    const navKey = viewKey();
    if (!navBackFlag && lastSnap && lastNavKey !== navKey) {
        navStack.push(lastSnap);
        if (navStack.length > 60) navStack.shift();
    }
    navBackFlag = false;
    lastNavKey = navKey;
    if (ytPlayerCleanup) { ytPlayerCleanup(); ytPlayerCleanup = null; }
    const area = document.getElementById('main-content');
    area.querySelectorAll('video, audio').forEach(m => {
        try { m.pause(); m.removeAttribute('src'); m.load(); } catch {}
    });
    const isShorts = state.view === 'shorts';
    area.style.padding = isShorts ? '0' : '';
    area.style.overflowY = isShorts ? 'hidden' : '';
    area.style.position = isShorts ? 'relative' : '';
    let html = '';
    if (isShorts) html = renderShorts();
    else if (state.view === 'home')     html = renderHome();
    else if (state.view === 'search')  html = renderSearch();
    else if (state.view === 'channel') html = renderChannel();
    else if (state.view === 'playlists') html = renderPlaylists();
    else if (state.view === 'playlist') html = renderPlaylistView();
    else if (state.view === 'player')  html = renderPlayer();
    else if (state.view === 'settings') html = renderSettings();
    else if (state.view === 'saved')    html = renderSaved();
    else if (state.view === 'savedPlayer') html = renderSavedPlayerView();
    area.innerHTML = `<div class="fade-in" style="width:100%;height:100%">${html}</div>`;
    if (isShorts) shortsInit();
    if (state.view === 'player') { attachManualSyncLogic(); setupPlayerExtras(); }
    if (state.view === 'savedPlayer' && state.savedRecord && !state.savedLoading) attachSavedPlayerLogic(state.savedRecord);
    updateSavedBadge();
    hydrateAvatars();
    lastSnap = takeSnap();
    const bb = document.getElementById('back-btn');
    if (bb) bb.disabled = navStack.length === 0;
}

    state.activeChip = chip;
    if (chip === 'All') {
        refreshFeed();
    } else {
        const q = chip.toLowerCase();
        state.feedLoading = true;
        render();
        searchInvidious(q).then(data => {
            db.feed = Array.isArray(data)
                ? data.filter(v => v.type === 'video').map(v => mkItem(v)).sort(() => Math.random() - 0.5)

            render();

// Plays a saved video straight from its IndexedDB blob(s) via object URLs — nothing is ever written
// to disk or exposed as a link; the URLs are revoked the moment this view is left.
function attachSavedPlayerLogic(rec) {
    const root = document.getElementById('yt-saved-player');
    const vid  = document.getElementById('ytsp-video');
    const aud  = document.getElementById('ytsp-audio'); // null for 360p (single stream)
    if (!root || !vid) return;

    const HIDDEN = 'ytcp-hidden';
    const hasAudio = !!aud;
    const videoURL = URL.createObjectURL(rec.videoBlob);
    const audioURL = hasAudio ? URL.createObjectURL(rec.audioBlob) : null;
    vid.src = videoURL;
    if (hasAudio) aud.src = audioURL;

    const ui = {
        bigplay:     document.getElementById('ytsp-bigplay'),
        bigplayIcon: document.getElementById('ytsp-bigplay-icon'),
        controls:    document.getElementById('ytsp-controls'),
        progress:    document.getElementById('ytsp-progress'),
        played:      document.getElementById('ytsp-played'),
        thumb:       document.getElementById('ytsp-thumb'),
        play:        document.getElementById('ytsp-play'),
        playIcon:    document.getElementById('ytsp-play-icon'),
        mute:        document.getElementById('ytsp-mute'),
        muteIcon:    document.getElementById('ytsp-mute-icon'),
        vol:         document.getElementById('ytsp-vol'),
        time:        document.getElementById('ytsp-time'),
        fs:          document.getElementById('ytsp-fs'),
        fsIcon:      document.getElementById('ytsp-fs-icon'),
    };

    let playing = false, wantPlay = false, ended = false;
    let dragging = false, dragTime = 0, overControls = false;
    let hideTimer = null, clickTimer = null, destroyed = false;

    function fmt(s) { if (!isFinite(s)) return '0:00'; const m = Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }
    function getDuration() { return isFinite(vid.duration) ? vid.duration : 0; }
    function startBoth() { vid.play().catch(() => {}); if (hasAudio) aud.play().catch(() => {}); playing = true; }
    function pauseBoth() { vid.pause(); if (hasAudio) aud.pause(); playing = false; }

    function togglePlay() {
        if (ended) { ended = false; seekTo(0); wantPlay = true; startBoth(); return; }
        wantPlay = !wantPlay;
        if (wantPlay) startBoth(); else { pauseBoth(); showControls(); }
    }
    function seekTo(t) {
        const dur = getDuration(); t = Math.max(0, Math.min(t, dur || 0));
        ended = false; vid.currentTime = t; if (hasAudio) aud.currentTime = t;
        showControls();
    }

    // Same drift-correction idea as the live manual-sync player: the video element is the clock,
    // and the audio element is nudged back in line with it every tick.
    function tick() {
        if (destroyed) return;
        const dur = getDuration(), vt = vid.currentTime;
        if (playing && hasAudio && Math.abs(aud.currentTime - vt) > 0.15) aud.currentTime = vt;
        updateUI(dur, vt);
    }
    function updateUI(dur, vt) {
        const cur = dragging ? dragTime : vt, pct = dur ? Math.min(100, (cur/dur)*100) : 0;
        ui.played.style.width = pct + '%'; ui.thumb.style.left = pct + '%';
        ui.time.textContent = fmt(cur) + ' / ' + fmt(dur);
        const showBig = !wantPlay || ended;
        ui.bigplay.classList.toggle(HIDDEN, !showBig);
        ui.bigplayIcon.className = 'fa ' + (ended ? 'fa-rotate-right' : 'fa-play');
        ui.playIcon.className = 'fa ' + (ended ? 'fa-rotate-right' : wantPlay ? 'fa-pause' : 'fa-play');
    }

    function applyVolume() {
        if (hasAudio) { aud.volume = ytVolume; aud.muted = ytMuted; }
        else { vid.volume = ytVolume; vid.muted = ytMuted; }
        ui.vol.value = ytMuted ? 0 : ytVolume;
        ui.muteIcon.className = 'fa ' + ((ytMuted || ytVolume === 0) ? 'fa-volume-xmark' : ytVolume < 0.5 ? 'fa-volume-low' : 'fa-volume-high');
    }
    function toggleMute() { ytMuted = !ytMuted; if (!ytMuted && ytVolume === 0) ytVolume = 0.5; applyVolume(); }
    function toggleFs() {
        if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
    const onFs = () => { const isFs = (document.fullscreenElement || document.webkitFullscreenElement) === root; ui.fsIcon.className = 'fa ' + (isFs ? 'fa-compress' : 'fa-expand'); };

    function showControls() {
        root.classList.remove('hide-controls'); clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { if (wantPlay && !ended && !dragging && !overControls) root.classList.add('hide-controls'); }, 2500);
    }

    vid.addEventListener('ended', () => { ended = true; wantPlay = false; pauseBoth(); showControls(); });
    ui.play.addEventListener('click', togglePlay);
    ui.mute.addEventListener('click', toggleMute);
    ui.fs.addEventListener('click', toggleFs);

let ytPlayerCleanup = null;

// ─── Player extras: likes/views, captions, comments ──────────────────────────
const detailsCache = {}, commentsCache = {}, capTextCache = {};
function fetchText(url, ms = 12000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .finally(() => clearTimeout(timer));
}
function fmtFull(n) { n = Number(n); return isFinite(n) && n > 0 ? n.toLocaleString() : ''; }

async function setupPlayerExtras() {
    const item = state.selectedItem, main = document.getElementById('player-main');
    if (!item || !main) return;
    const id = item.id;
    const box = document.createElement('div');
    box.id = 'player-extras';
    box.innerHTML = '<div id="pe-stats"></div><div id="pe-desc"></div><div id="pe-comments"></div>';
    main.appendChild(box);
    const stillHere = () => state.view === 'player' && state.selectedItem && state.selectedItem.id === id && document.getElementById('player-extras') === box;

    paintComments(id, box);
    if (!commentsCache[id]) loadComments(id, false, box, stillHere);

    let d = detailsCache[id];
    if (!d) {
        try {
            d = await invidiousJSON(`/api/v1/videos/${encodeURIComponent(id)}?fields=likeCount,viewCount,published,publishedText,description,captions`);
            d._base = state.ytInstance;
            detailsCache[id] = d;
        } catch { d = null; }
    }
    if (!stillHere()) return;
    if (d) {
        const likes = fmtFull(d.likeCount), views = fmtFull(d.viewCount);
        box.querySelector('#pe-stats').className = 'pe-stats';
        box.querySelector('#pe-stats').innerHTML =
            (likes ? `<span class="pe-pill"><i class="fa fa-thumbs-up"></i>${likes}</span>` : '') +
            (views ? `<span class="pe-pill"><i class="fa fa-eye"></i>${views} views</span>` : '') +
            (d.publishedText ? `<span style="color:#aaa">${esc(d.publishedText)}</span>` : '');
        if (d.description) {
            const el = box.querySelector('#pe-desc');
            el.className = 'pe-desc';
            el.textContent = d.description;
            el.onclick = () => el.classList.toggle('open');
        }
        setupCaptions(d, stillHere);
    }
}

function setupCaptions(d, stillHere) {
    const vid = document.getElementById('yt-dash-video');
    const btn = document.getElementById('ytcp-cc'), controls = document.getElementById('ytcp-controls');
    const caps = (d.captions || []).filter(c => c && c.url);
    if (!vid || !btn || !controls || !caps.length) return;
    btn.classList.remove('ytcp-hidden');
    let menu = null, current = -1;

    async function choose(i) {
        Array.from(vid.querySelectorAll('track')).forEach(t => t.remove());
        Array.from(vid.textTracks).forEach(t => { t.mode = 'disabled'; });
        current = i;
        btn.classList.toggle('cc-on', i >= 0);
        try { localStorage.setItem('yyt_cc', i >= 0 ? (caps[i].languageCode || caps[i].label) : ''); } catch {}
        if (i < 0) return;
        const c = caps[i];
        try {
            let text = capTextCache[c.url];
            if (!text) {
                const u = c.url.startsWith('http') ? c.url : (d._base || state.ytInstance) + c.url;
                text = await fetchText(proxied(u));
                capTextCache[c.url] = text;
            }
            if (!stillHere() || current !== i) return;
            const tr = document.createElement('track');
            tr.kind = 'captions'; tr.label = c.label || c.languageCode; tr.srclang = c.languageCode || 'en';
            tr.src = URL.createObjectURL(new Blob([text], { type: 'text/vtt' }));
            vid.appendChild(tr);
            tr.track.mode = 'showing';
        } catch { toastMsg("Couldn't load captions"); btn.classList.remove('cc-on'); current = -1; }
    }
    function closeMenu() { if (menu) { menu.remove(); menu = null; } }
    btn.addEventListener('click', e => {
        e.stopPropagation();
        if (menu) return closeMenu();
        menu = document.createElement('div');
        menu.className = 'ytcp-cc-menu';
        menu.innerHTML = `<div data-i="-1" class="${current < 0 ? 'on' : ''}">Off</div>` +
            caps.map((c, i) => `<div data-i="${i}" class="${current === i ? 'on' : ''}">${esc(c.label || c.languageCode)}</div>`).join('');
        menu.addEventListener('click', ev => {
            ev.stopPropagation();
            const t = ev.target.closest('[data-i]');
            if (t) { closeMenu(); choose(parseInt(t.dataset.i, 10)); }
        });
        controls.parentNode.appendChild(menu);
    });
    document.getElementById('yt-custom-player').addEventListener('click', e => { if (menu && !menu.contains(e.target) && e.target !== btn) closeMenu(); });

    let pref = '';
    try { pref = localStorage.getItem('yyt_cc') || ''; } catch {}
    if (pref) { const i = caps.findIndex(c => (c.languageCode || c.label) === pref); if (i >= 0) choose(i); }
}

async function loadComments(id, more, box, stillHere) {
    const cm = commentsCache[id] || (commentsCache[id] = { items: [], cont: null, done: false, busy: false, err: false, total: 0 });
    if (cm.busy || cm.done) return;
    cm.busy = true; cm.err = false;
    paintComments(id, box);
    try {
        let path = `/api/v1/comments/${encodeURIComponent(id)}`;
        if (cm.cont) path += `?continuation=${encodeURIComponent(cm.cont)}`;
        const d = await invidiousJSON(path);
        (d.comments || []).forEach(c => cm.items.push(c));
        cm.total = d.commentCount || cm.total;
        cm.cont = d.continuation || null;
        cm.done = !cm.cont || !(d.comments || []).length;
    } catch { cm.err = true; if (!cm.items.length) cm.done = false; }
    cm.busy = false;
    if (stillHere()) paintComments(id, box);
}

function paintComments(id, box) {
    const el = box.querySelector('#pe-comments');
    if (!el) return;
    const cm = commentsCache[id];
    if (!cm || (cm.busy && !cm.items.length)) { el.innerHTML = '<div class="pe-comments-h">Comments</div>' + spinnerHTML('Loading comments…'); return; }
    if (cm.err && !cm.items.length) {
        el.innerHTML = '<div class="pe-comments-h">Comments</div><div class="empty-note">Comments are unavailable for this video.</div>';
        return;
    }
    if (!cm.items.length) { el.innerHTML = '<div class="pe-comments-h">Comments</div><div class="empty-note">No comments.</div>'; return; }
    const rows = cm.items.map(c => {
        const av = avatarThumb(c.authorThumbnails), ini = esc(((c.author || '?').replace(/^@/, '')[0] || '?').toUpperCase());
        const likes = fmtCount(c.likeCount);
        return `<div class="cm">
            <div class="cm-av">${av ? `<img src="${esc(av)}" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${ini}'))">` : ini}</div>
            <div class="cm-body">
                ${c.isPinned ? '<div class="cm-pin"><i class="fa fa-thumbtack"></i> Pinned</div>' : ''}
                <div class="cm-head">${esc(c.author || '')}<span>${esc(c.publishedText || '')}</span></div>
                <div class="cm-text">${esc(c.content || '')}</div>
                <div class="cm-likes"><i class="fa fa-thumbs-up"></i> ${likes || ''}${c.replies && c.replies.replyCount ? ` · ${c.replies.replyCount} replies` : ''}</div>
            </div></div>`;
    }).join('');
    const more = cm.done ? '' : `<div style="text-align:center;margin:8px 0 24px">${cm.busy
        ? '<i class="fa fa-circle-notch fa-spin" style="color:#3ea6ff;font-size:24px"></i>'
        : '<button class="yt-btn-ghost" id="pe-more">Show more comments</button>'}</div>`;
    el.innerHTML = `<div class="pe-comments-h">${cm.total ? fmtFull(cm.total) + ' ' : ''}Comments</div>${rows}${more}`;
    const mb = el.querySelector('#pe-more');
    if (mb) mb.onclick = () => loadComments(id, true, box, () => document.getElementById('player-extras') === box);
}

function attachManualSyncLogic() {
    const root = document.getElementById('yt-custom-player');
    const vid  = document.getElementById('yt-dash-video');

        bigplayIcon: document.getElementById('ytcp-bigplay-icon'),
        error:       document.getElementById('ytcp-error'),
        errorMsg:    document.getElementById('ytcp-error-msg'),
        controls:    document.getElementById('ytcp-controls'),
        progress:    document.getElementById('ytcp-progress'),
        buffered:    document.getElementById('ytcp-buffered'),
        played:      document.getElementById('ytcp-played'),
        thumb:       document.getElementById('ytcp-thumb'),
        play:        document.getElementById('ytcp-play'),
        playIcon:    document.getElementById('ytcp-play-icon'),
        mute:        document.getElementById('ytcp-mute'),
        muteIcon:    document.getElementById('ytcp-mute-icon'),
        vol:         document.getElementById('ytcp-vol'),
        time:        document.getElementById('ytcp-time'),
        fs:          document.getElementById('ytcp-fs'),
        fsIcon:      document.getElementById('ytcp-fs-icon'),
    };

    let playing = false, wantPlay = true, ended = false, failed = false;
    let dragging = false, dragTime = 0, overControls = false;

    }
    function bufferedEnd(el, ct) { let e = ct; for (let i = 0; i < el.buffered.length; i++) if (el.buffered.start(i) <= ct + 0.5) e = Math.max(e, el.buffered.end(i)); return e; }

        vid.play().catch(blocked);
        if (hasAudio) aud.play().catch(blocked);
    }

    function fail(msg) {
        if (failed || destroyed) return;
        failed = true; pauseBoth();
        ui.errorMsg.textContent = msg;
        ui.error.classList.remove(HIDDEN);
        ui.spinner.classList.add(HIDDEN);
    }
    function togglePlay() {
        if (failed) return;
        if (ended) { ended = false; seekTo(0); wantPlay = true; return; }

        }
    }

    const onMediaError = () => {
        // Video and audio usually fail together on a dead server, so only move on once per server.
        if (destroyed || errIdx === instanceIdx) return;
        errIdx = instanceIdx;
        instanceIdx++;
        if (instanceIdx < instances.length) {
            ui.error.classList.add(HIDDEN);
            loadInstance(instanceIdx);
        } else {
            fail("Couldn't load the " + qualityLabel + " stream from any Invidious server.");
        }
    };
    vid.addEventListener('error', onMediaError);

    function tick() {
        if (destroyed) return;

            } else {

                    aud.playbackRate = Math.max(0.9, Math.min(1.1, 1 - drift * 0.5));   // gentle catch-up, no seeking
                } else if (aud.playbackRate !== 1) {
                    aud.playbackRate = 1;
                }
            }
        }

        // (Re)start once enough of every stream is buffered.
        if (wantPlay && !playing && !failed && !ended && !dragging) {
            const bothReady = ready(vid, START_BUFFER) && (!hasAudio || ready(aud, START_BUFFER));
            if (!bothReady) {
                if (hasAudio && Math.abs(aud.currentTime - vt) > 0.1 && lastAlignVt !== vt) { aud.currentTime = vt; lastAlignVt = vt; }

    }

    function updateUI(dur, vt) {
        const cur = dragging ? dragTime : vt, pct = dur ? Math.min(100, (cur/dur)*100) : 0;

        const bEnd = hasAudio ? Math.min(bufferedEnd(vid, vt), bufferedEnd(aud, vt)) : bufferedEnd(vid, vt);
        ui.buffered.style.width = (dur ? Math.min(100, Math.max((bEnd/dur)*100, pct)) : 0) + '%';
        ui.time.textContent = fmt(cur) + ' / ' + fmt(dur);
        const buffering = wantPlay && !ended && !failed && !dragging && (!playing || vid.readyState < 3);
        ui.spinner.classList.toggle(HIDDEN, !buffering);
        const showBig = (!wantPlay || ended) && !failed;
        ui.bigplay.classList.toggle(HIDDEN, !showBig);
        ui.bigplayIcon.className = 'fa ' + (ended ? 'fa-rotate-right' : 'fa-play');
        ui.playIcon.className = 'fa ' + (ended ? 'fa-rotate-right' : wantPlay ? 'fa-pause' : 'fa-play');
    }

    function applyVolume() {
        const out = hasAudio ? aud : vid;     // 720p: the video element stays muted, the audio element carries the sound
        out.volume = ytVolume; out.muted = ytMuted;
        ui.vol.value = ytMuted ? 0 : ytVolume;
        ui.muteIcon.className = 'fa ' + ((ytMuted || ytVolume === 0) ? 'fa-volume-xmark' : ytVolume < 0.5 ? 'fa-volume-low' : 'fa-volume-high');
    }
    function toggleMute() { ytMuted = !ytMuted; if (!ytMuted && ytVolume === 0) ytVolume = 0.5; applyVolume(); }
    function toggleFs() {
        if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
    const onFs = () => { const isFs = (document.fullscreenElement || document.webkitFullscreenElement) === root; ui.fsIcon.className = 'fa ' + (isFs ? 'fa-compress' : 'fa-expand'); };

    function showControls() {
        root.classList.remove('hide-controls'); clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { if (wantPlay && !ended && !failed && !dragging && !overControls) root.classList.add('hide-controls'); }, 2500);
    }

    ui.play.addEventListener('click', togglePlay);
    ui.mute.addEventListener('click', toggleMute);
    ui.fs.addEventListener('click', toggleFs);
    ui.vol.addEventListener('input', () => { ytVolume = parseFloat(ui.vol.value); ytMuted = ytVolume === 0; applyVolume(); });
    ui.vol.addEventListener('change', () => ui.vol.blur());
    vid.addEventListener('click', () => { clearTimeout(clickTimer); clickTimer = setTimeout(togglePlay, 220); });
    vid.addEventListener('dblclick', () => { clearTimeout(clickTimer); toggleFs(); });
    vid.addEventListener('ended', () => { ended = true; wantPlay = false; pauseBoth(); showControls(); playlistNext(); });
    root.addEventListener('mousemove', showControls);
    root.addEventListener('touchstart', showControls, { passive: true });
    ui.controls.addEventListener('mouseenter', () => { overControls = true; });
    ui.controls.addEventListener('mouseleave', () => { overControls = false; showControls(); });

    const timeFromPointer = e => { const r = ui.progress.getBoundingClientRect(), x = Math.min(Math.max(e.clientX - r.left, 0), r.width); return (r.width ? x/r.width : 0) * getDuration(); };
    ui.progress.addEventListener('pointerdown', e => { if (!getDuration() || failed) return; dragging = true; if (playing) pauseBoth(); dragTime = timeFromPointer(e); ui.progress.setPointerCapture(e.pointerId); ui.progress.classList.add('dragging'); updateUI(getDuration(), vid.currentTime); });
    ui.progress.addEventListener('pointermove', e => { if (dragging) { dragTime = timeFromPointer(e); updateUI(getDuration(), vid.currentTime); } });
    ui.progress.addEventListener('pointerup', e => { if (!dragging) return; dragging = false; ui.progress.classList.remove('dragging'); seekTo(timeFromPointer(e)); });
    ui.progress.addEventListener('pointercancel', () => { dragging = false; ui.progress.classList.remove('dragging'); });

    const onKey = e => { if (e.ctrlKey || e.metaKey || e.altKey) return; const tag = (e.target && e.target.tagName) || ''; if (tag === 'INPUT' || tag === 'TEXTAREA') return; if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return; switch (e.key) { case ' ': case 'k': e.preventDefault(); togglePlay(); break; case 'ArrowLeft': e.preventDefault(); seekTo(vid.currentTime - 5); break; case 'ArrowRight': e.preventDefault(); seekTo(vid.currentTime + 5); break; case 'j': seekTo(vid.currentTime - 10); break; case 'l': seekTo(vid.currentTime + 10); break; case 'm': toggleMute(); break; case 'f': toggleFs(); break; } };
    document.addEventListener('keydown', onKey);
    document.addEventListener('fullscreenchange', onFs);
    document.addEventListener('webkitfullscreenchange', onFs);

    applyVolume(); showControls();
    const interval = setInterval(tick, 120); tick();

    ytPlayerCleanup = () => {
        destroyed = true; clearInterval(interval); clearTimeout(hideTimer); clearTimeout(clickTimer);
        document.removeEventListener('keydown', onKey);
        document.removeEventListener('fullscreenchange', onFs);
        document.removeEventListener('webkitfullscreenchange', onFs);
    };
}

// ── Channel avatars ──
// Video results carry the channel's avatar; when they don't, it is fetched once per channel and cached.
const avatarCache = (() => { try { return JSON.parse(localStorage.getItem('yyt_avatars') || '{}'); } catch { return {}; } })();
const avatarBusy = new Set(), avatarBad = new Set(), avatarQueue = [];
let avatarActive = 0;
function avatarThumb(list) {
    if (!Array.isArray(list) || !list.length) return '';
    const sorted = list.filter(t => t && t.url).sort((a, b) => (a.width || 0) - (b.width || 0));
    const pick = sorted.find(t => (t.width || 0) >= 64) || sorted[sorted.length - 1];
    if (!pick) return '';
    let u = pick.url;
    if (u.startsWith('//')) u = 'https:' + u;

function rememberAvatar(id, url) {
    if (!id || !url || avatarCache[id] === url) return;

        try {
            const keys = Object.keys(avatarCache);

            localStorage.setItem('yyt_avatars', JSON.stringify(avatarCache));

    }, 500);
}
function avatarFail(img, id) {
    delete avatarCache[id]; avatarBad.add(id);
    img.replaceWith(document.createTextNode(img.dataset.i || '?'));
}
function avatarInner(item) {
    const initial = esc(((item.channel || '?')[0] || '?').toUpperCase());
    const id = item.channelId;
    if (!id) return initial;
    const url = avatarCache[id];
    if (url) return `<img class="av-img" src="${esc(url)}" alt="" referrerpolicy="no-referrer" data-i="${initial}" onerror="avatarFail(this,'${esc(id)}')">`;
    return avatarBad.has(id) ? initial : `<span class="av-pending" data-ch="${esc(id)}">${initial}</span>`;
}
function applyAvatars() {
    document.querySelectorAll('.av-pending').forEach(sp => {
        const id = sp.dataset.ch, url = avatarCache[id];
        if (!url) return;
        const img = document.createElement('img');
        img.className = 'av-img'; img.alt = ''; img.referrerPolicy = 'no-referrer';
        img.dataset.i = sp.textContent;
        img.onerror = () => avatarFail(img, id);
        img.src = url;
        sp.replaceWith(img);
    });
}
function hydrateAvatars() {
    applyAvatars();
    document.querySelectorAll('.av-pending').forEach(sp => {
        const id = sp.dataset.ch;
        if (!avatarCache[id] && !avatarBusy.has(id) && !avatarBad.has(id)) { avatarBusy.add(id); avatarQueue.push(id); }
    });
    pumpAvatars();
}
function pumpAvatars() {
    while (avatarActive < 3 && avatarQueue.length) {
        const id = avatarQueue.shift();
        avatarActive++;
        invidiousJSON(`/api/v1/channels/${encodeURIComponent(id)}?fields=authorThumbnails`)
            .then(d => { const u = avatarThumb(d.authorThumbnails); if (u) rememberAvatar(id, u); else avatarBad.add(id); })
            .catch(() => avatarBad.add(id))
            .finally(() => { avatarActive--; avatarBusy.delete(id); applyAvatars(); pumpAvatars(); });
    }
}

function mkItem(v, fb) {
    const it = {
        id: v.videoId, title: v.title,
        channel: v.author || (fb && fb.author) || '',
        channelId: v.authorId || (fb && fb.id) || '',
        len: v.lengthSeconds || 0
    };
    itemReg[it.id] = it;
    if (it.channelId) { const av = avatarThumb(v.authorThumbnails); if (av) rememberAvatar(it.channelId, av); }
    return it;
}
function fmtCount(n) {
    n = Number(n);
    if (!isFinite(n) || n <= 0) return '';
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
    return String(n);
}
function fmtLen(s) {
    s = Number(s);
    if (!(s > 0)) return '';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
function thumbUrl(list) {
    if (!Array.isArray(list) || !list.length) return '';
    let u = list.reduce((a, b) => ((b.width || 0) > (a.width || 0) ? b : a)).url || '';
    if (u.startsWith('//')) u = 'https:' + u;
    else if (u.startsWith('/')) u = state.ytInstance + u;
    return u ? proxied(u) : '';
}
function keepScrollRender() {

}

function openChannel(id) {

async function loadChannelInfo() {
    const ch = state.ch;
    try {
        const d = await invidiousJSON(`/api/v1/channels/${encodeURIComponent(ch.id)}`);
        if (state.ch !== ch) return;
        ch.info = d;
    } catch { if (state.ch === ch) ch.err = true; }
    if (state.ch === ch && state.view === 'channel') keepScrollRender();
}
async function loadChannelTab(tab, more) {
    const ch = state.ch;
    if (!ch || tab === 'about') return;
    const t = ch.data[tab] || (ch.data[tab] = { items: [], cont: null, loaded: false, busy: false, err: false, done: false });
    if (t.busy || (t.loaded && !more)) return;
    t.busy = true; t.err = false;
    if (state.ch === ch && state.view === 'channel') keepScrollRender();
    try {
        let path = `/api/v1/channels/${encodeURIComponent(ch.id)}/${tab}`;
        if (more && t.cont) path += `?continuation=${encodeURIComponent(t.cont)}`;
        const d = await invidiousJSON(path);
        const list = Array.isArray(d) ? d : (d.videos || d.playlists || []);
        const fb = { id: ch.id, author: ch.info && ch.info.author };
        list.forEach(v => t.items.push(tab === 'playlists' ? v : mkItem(v, fb)));
        t.cont = (!Array.isArray(d) && d.continuation) || null;
        t.done = !t.cont || !list.length;
        t.loaded = true;
    } catch { t.err = true; }
    t.busy = false;
    if (state.ch === ch && state.view === 'channel') keepScrollRender();
}
function setChannelTab(tab) {
    if (!state.ch) return;
    state.ch.tab = tab;
    render();
    loadChannelTab(tab);
}
function channelTabBody(ch) {
    if (ch.tab === 'about') {
        const i = ch.info;
        if (!i) return ch.err ? `<div class="empty-note">Couldn't load channel info.</div>` : spinnerHTML();
        const bits = [fmtCount(i.subCount) ? fmtCount(i.subCount) + ' subscribers' : '',
                      i.joined ? 'Joined ' + new Date(i.joined * 1000).toLocaleDateString() : '',
                      fmtCount(i.totalViews) ? fmtCount(i.totalViews) + ' total views' : ''].filter(Boolean);
        return `<div class="ch-about">${esc(i.description || 'No description.').replace(/\n/g, '<br>')}
                <div class="ch-sub">${bits.join(' · ')}</div></div>`;
    }
    const t = ch.data[ch.tab];
    if (!t || (!t.loaded && t.busy)) return spinnerHTML();
    if (t.err && !t.loaded) return `<div class="empty-note">Couldn't load this tab. <button class="yt-btn" style="margin-left:8px" onclick="loadChannelTab('${ch.tab}')">Retry</button></div>`;
    if (!t.items.length) return `<div class="empty-note">Nothing here.</div>`;
    const grid = ch.tab === 'playlists'
        ? `<div class="video-grid">${t.items.map(playlistCardHTML).join('')}</div>`
        : `<div class="video-grid">${t.items.map(videoCardHTML).join('')}</div>`;
    const more = t.done ? '' : `<div style="text-align:center;margin-top:24px">${t.busy
        ? '<i class="fa fa-circle-notch fa-spin" style="color:#3ea6ff;font-size:24px"></i>'
        : `<button class="yt-btn-ghost" onclick="loadChannelTab('${ch.tab}',true)">Load more</button>`}</div>`;
    const retry = t.err ? `<div class="empty-note" style="text-align:center">Couldn't load more.</div>` : '';
    return grid + retry + more;
}
function renderChannel() {

    const banner = thumbUrl(info.authorBanners), avatar = thumbUrl(info.authorThumbnails);
    const name = info.author || (ch.err ? 'Channel unavailable' : 'Loading channel…');
    const subs = fmtCount(info.subCount);

function plToggle(plId, vid) {

async function loadRemotePlaylist(more) {
    const lv = state.listView;
    if (!lv || lv.kind !== 'remote' || lv.busy) return;
    lv.busy = true; lv.err = false;
    if (more) { lv.page++; keepScrollRender(); }
    try {
        const d = await invidiousJSON(`/api/v1/playlists/${encodeURIComponent(lv.id)}?page=${lv.page}`);
        if (state.listView !== lv) return;
        lv.title = d.title; lv.author = d.author; lv.authorId = d.authorId; lv.total = d.videoCount;
        const vids = (d.videos || []).map(v => mkItem(v));
        lv.items.push(...vids);
        if (!vids.length || (lv.total && lv.items.length >= lv.total)) lv.done = true;
    } catch { lv.err = true; if (more) lv.page--; }
    lv.loading = false; lv.busy = false;
    if (state.listView === lv && state.view === 'playlist') keepScrollRender();
}
