// ─── Shorts ───────────────────────────────────────────────────────────────────
// Pipeline: search (hashtags + creators, <=60s) -> candidate queue -> background verify/preload
// (a hidden <video> loads the real stream; only vertical, <=61s videos are accepted) -> ready list
// -> vertical scroll-snap feed. The very same preloaded <video> element is moved into the slide.
const DEFAULT_SHORT_TAGS = ['#shorts', '#youtubeshorts', '#shorts funny', '#viral shorts'];
const DEFAULT_SHORT_CREATORS = ['Zack D. Films', 'MrBeast', 'Khaby Lame', 'Dude Perfect', 'Alan Chikin Chow', 'Stokes Twins', 'Dhar Mann', 'Mark Rober'];
function loadList(key, def) {
    try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return Array.isArray(v) && v.length ? v : [...def]; }
    catch { return [...def]; }
}
function saveList(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
let shortTags = loadList('yyt_short_tags', DEFAULT_SHORT_TAGS);
let shortCreators = loadList('yyt_short_creators', DEFAULT_SHORT_CREATORS);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normName = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const SHORT_TAG_RE = /#(shorts?|youtubeshorts)\b/i;
const SHORT_MAX_SECONDS = 60;

const SH = {
    items: [],            // verified, preloaded Shorts (append-only)
    cand: [],             // candidates waiting to be verified
    seen: new Set(),
    verifying: 0, fetching: false, exhausted: false,
    emptyFetches: 0, dryRounds: 0, lastCount: 0,
    pages: {}, cont: {}, done: {}, creatorCursor: 0, gen: 0,
    idx: 0, activeRec: null, muted: false, wheelLock: false,
    root: null, scroller: null, endEl: null, observer: null,
    ticker: null, onKey: null, onVis: null, endHTML: '',
};
const shortsHolder = document.createElement('div');
shortsHolder.id = 'shorts-holder';
document.body.appendChild(shortsHolder);

function shortsDiscard(v) {
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch {}
}

// ── Sourcing ──
// Creator name -> channel id (cached), so we can read the creator's real Shorts tab.
const shortChIds = (() => { try { return JSON.parse(localStorage.getItem('yyt_short_chids') || '{}'); } catch { return {}; } })();
async function shortsResolveChannel(name) {
    const k = normName(name);
    if (shortChIds[k]) return shortChIds[k];
    const data = await searchInvidious(name, { type: 'channel' });
    const list = Array.isArray(data) ? data.filter(c => c.type === 'channel' && c.authorId) : [];
    const hit = list.find(c => normName(c.author) === k)
             || list.find(c => normName(c.author).includes(k) || k.includes(normName(c.author)));
    if (!hit) return null;
    shortChIds[k] = hit.authorId;
    try { localStorage.setItem('yyt_short_chids', JSON.stringify(shortChIds)); } catch {}
    return hit.authorId;
}

// Sources, best first:
//  1. each creator's own Shorts tab  (/channels/:id/shorts)  -> videos YouTube itself flags as Shorts
//  2. the hashtag page               (/hashtag/:tag)         -> falls back to a <=1 min search if the server lacks it
async function shortsFetchCandidates() {
    const jobs = [];
    let guard = 0, picked = 0;
    while (picked < 3 && guard++ < shortCreators.length * 2 && shortCreators.length) {
        const c = shortCreators[SH.creatorCursor++ % shortCreators.length];
        const key = 'c:' + c;
        if (SH.done[key]) continue;
        picked++;
        jobs.push((async () => {
            const id = await shortsResolveChannel(c);
            if (!id) { SH.done[key] = true; return []; }
            let path = `/api/v1/channels/${encodeURIComponent(id)}/shorts`;
            if (SH.cont[key]) path += `?continuation=${encodeURIComponent(SH.cont[key])}`;
            const d = await invidiousJSON(path);
            const list = Array.isArray(d) ? d : (d.videos || []);
            SH.cont[key] = (!Array.isArray(d) && d.continuation) || null;
            if (!SH.cont[key]) SH.done[key] = true;
            return list.map(v => ({ v, official: true }));
        })());
    }
    [...shortTags].sort(() => Math.random() - 0.5).slice(0, 2).forEach(t => {
        const key = 't:' + t;
        jobs.push((async () => {
            const page = (SH.pages[key] || 0) + 1;
            SH.pages[key] = page;
            const tag = t.replace(/^#/, '').trim();
            if (tag && !/\s/.test(tag)) {
                try {
                    const d = await invidiousJSON(`/api/v1/hashtag/${encodeURIComponent(tag)}?page=${page}`);
                    const list = Array.isArray(d) ? d : (d.results || d.videos || []);
                    if (list.length) return list.map(v => ({ v, official: false }));
                } catch {}
            }
            const data = await searchInvidious(t, { page, duration: 'short' });
            return data.map(v => ({ v, official: false }));
        })());
    });

    const results = await Promise.allSettled(jobs);
    const official = [], tagged = [];
    for (const r of results) {
        if (r.status !== 'fulfilled') continue;
        for (const { v, official: isOff } of r.value) {
            if (!v || (v.type && v.type !== 'video') || !v.videoId || v.liveNow || SH.seen.has(v.videoId)) continue;
            const len = Number(v.lengthSeconds) || 0;
            if (isOff ? len > 180 : !(len > 0 && len <= SHORT_MAX_SECONDS)) continue;
            SH.seen.add(v.videoId);
            const isTagged = SHORT_TAG_RE.test((v.title || '') + ' ' + (v.description || ''));
            (isOff ? official : tagged).push({ id: v.videoId, title: v.title, channel: v.author, channelId: v.authorId, tagged: isTagged, official: isOff });
        }
    }
    official.sort(() => Math.random() - 0.5);
    tagged.sort((a, b) => (b.tagged ? 1 : 0) - (a.tagged ? 1 : 0));
    const out = [];
    while (official.length || tagged.length) {                                 // interleave real Shorts with hashtag finds
        if (official.length) out.push(official.shift());
        if (official.length) out.push(official.shift());
        if (tagged.length) out.push(tagged.shift());
    }
    return out;
}

async function shortsFetch() {
    SH.fetching = true;
    shortsUpdateEnd();
    const gen = SH.gen;
    if (SH.items.length > SH.lastCount) SH.dryRounds = 0; else SH.dryRounds++;
    SH.lastCount = SH.items.length;
    let list = [];
    try { list = await shortsFetchCandidates(); } catch {}
    SH.fetching = false;
    if (gen === SH.gen) {
        SH.cand.push(...list);
        if (list.length === 0) { if (++SH.emptyFetches >= 3) SH.exhausted = true; } else SH.emptyFetches = 0;
        if (SH.dryRounds >= 6) SH.exhausted = true;
    }
    shortsPump();
}

// ── Background verify + preload ──
function shortsPump() {
    const target = state.view === 'shorts' ? 5 : 2;                            // ready-ahead; small warm-up when elsewhere
    const base = Math.min(SH.idx, SH.items.length);
    const want = () => SH.items.length + SH.verifying < base + 1 + target;
    while (SH.verifying < 3 && SH.cand.length && want()) shortsVerify(SH.cand.shift());
    if (!SH.fetching && !SH.exhausted && want() && SH.cand.length < 3) shortsFetch();
    shortsUpdateEnd();
}

function shortsVerify(c) {
    SH.verifying++;
    const gen = SH.gen;
    const rec = { id: c.id, title: c.title, channel: c.channel, channelId: c.channelId, tagged: c.tagged, official: !!c.official,
                  ready: false, released: false, dead: false, inst: 0,
                  instances: getMediaInstances().slice(0, 5), el: null, dom: null };
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('playsinline', '');
    v.setAttribute('controlsList', 'nodownload noremoteplayback');
    v.disablePictureInPicture = true; v.disableRemotePlayback = true;
    v.addEventListener('contextmenu', e => e.preventDefault());
    rec.el = v;
    shortsHolder.appendChild(v);

    let timer = null, settled = false, metaOk = false;
    const settle = ok => {
        if (settled) return;
        settled = true; clearTimeout(timer); SH.verifying--;
        if (ok && gen === SH.gen) { rec.ready = true; SH.items.push(rec); shortsOnNewItem(rec); }
        else { shortsDiscard(v); if (v.parentNode) v.parentNode.removeChild(v); }
        shortsPump();
    };
    const arm = ms => { clearTimeout(timer); timer = setTimeout(tryNext, ms); };
    const load = () => { v.src = mediaUrl(rec.instances[rec.inst], rec.id, 18); v.load(); arm(12000); };
    function tryNext() {
        if (settled) return;
        if (++rec.inst >= rec.instances.length) return settle(false);
        metaOk = false; load();
    }
    v.addEventListener('loadedmetadata', () => {
        if (settled) return;
        // "Is it a Short?" — judged from the real stream: vertical frame and <= ~1 minute long.
        const vertical = v.videoHeight > v.videoWidth;
        const short = !isFinite(v.duration) || v.duration <= (rec.official ? 181 : SHORT_MAX_SECONDS + 1);
        if ((!vertical && !rec.official) || !short) return settle(false);   // videos from a creator's Shorts tab are trusted as Shorts
        metaOk = true; arm(12000);
    });
    v.addEventListener('loadeddata', () => { if (!settled && metaOk) settle(true); });
    v.addEventListener('error', () => { if (!settled) tryNext(); else if (rec.ready) shortsPlaybackError(rec); });
    load();
}

function shortsPlaybackError(rec) {
    const v = rec.el;
    if (rec.released || rec.dead || !v.getAttribute('src')) return;
    if (++rec.inst < rec.instances.length) {
        v.src = mediaUrl(rec.instances[rec.inst], rec.id, 18); v.load();
        if (SH.activeRec === rec && state.view === 'shorts') v.play().catch(() => {});
        return;
    }
    rec.dead = true;
    if (rec.dom) {
        rec.dom.err.textContent = "Couldn't play this one — skipping…";
        rec.dom.err.classList.add('on');
        setTimeout(() => { if (SH.activeRec === rec && state.view === 'shorts') shortsGo(1); }, 1200);
    }
}

function shortsRelease(rec) {
    rec.released = true;
    shortsDiscard(rec.el);
}

// ── View ──
function renderShorts() {
    return `
        <div id="shorts-root">
            <div id="shorts-scroller">
                <section id="shorts-end" class="short-slide" data-i="end"></section>
            </div>
            <div class="shorts-nav">
                <button id="shorts-up" title="Previous (↑)"><i class="fa fa-chevron-up"></i></button>
                <button id="shorts-down" title="Next (↓)"><i class="fa fa-chevron-down"></i></button>
            </div>
        </div>`;
}

function shortsBuildSlide(rec, i) {
    const s = document.createElement('section');
    s.className = 'short-slide';
    s.dataset.i = i;
    s.innerHTML = `
        <div class="short-card">
            <div class="short-gradient"></div>
            <div class="short-spin"><i class="fa fa-circle-notch fa-spin"></i></div>
            <div class="short-flash"><i class="fa fa-play"></i></div>
            <div class="short-err"></div>
            <button class="short-mute" title="Mute / unmute (m)"><i class="fa fa-volume-high"></i></button>
            <div class="short-info">
                <div class="short-ch"><span class="short-av">${avatarInner(rec)}</span><span>${esc(rec.channel || '')}</span></div>
                <div class="short-title">${esc(rec.title)}</div>
            </div>
            <div class="short-bar"><div class="short-fill"></div></div>
        </div>`;
    const card = s.firstElementChild;
    rec.el.className = 'short-video';
    card.insertBefore(rec.el, card.firstChild);
    rec.dom = {
        fill: card.querySelector('.short-fill'),
        spin: card.querySelector('.short-spin'),
        flash: card.querySelector('.short-flash'),
        err: card.querySelector('.short-err'),
        muteIcon: card.querySelector('.short-mute i'),
    };

    if (rec.channelId) {
        const chEl = card.querySelector('.short-ch');
        chEl.style.pointerEvents = 'auto'; chEl.style.cursor = 'pointer';
        chEl.addEventListener('click', e => { e.stopPropagation(); openChannel(rec.channelId); });
    }
    card.querySelector('.short-mute').addEventListener('click', e => { e.stopPropagation(); shortsToggleMute(); e.currentTarget.blur(); });
    card.querySelector('.short-bar').addEventListener('click', e => {
        e.stopPropagation();
        const r = e.currentTarget.getBoundingClientRect(), d = rec.el.duration;
        if (isFinite(d) && r.width) rec.el.currentTime = ((e.clientX - r.left) / r.width) * d;
    });
    card.addEventListener('click', () => {
        if (SH.activeRec === rec) shortsTogglePlay(); else shortsGo(SH.items.indexOf(rec) - SH.idx);
    });
    shortsSyncMuteIcon(rec);
    return s;
}

function shortsOnNewItem(rec) {
    if (!SH.root) return;                                                      // not in view: stays preloaded in the holder
    const s = shortsBuildSlide(rec, SH.items.length - 1);
    SH.scroller.insertBefore(s, SH.endEl);
    SH.observer.observe(s);
    hydrateAvatars();
}

function shortsInit() {
    SH.root = document.getElementById('shorts-root');
    SH.scroller = document.getElementById('shorts-scroller');
    SH.endEl = document.getElementById('shorts-end');
    SH.endHTML = '';

    SH.observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (!e.isIntersecting || e.intersectionRatio < 0.6) return;
            const k = e.target.dataset.i;
            shortsSetActive(k === 'end' ? SH.items.length : parseInt(k, 10));
        });
    }, { root: SH.scroller, threshold: [0.6] });

    SH.items.forEach((r, i) => {
        const s = shortsBuildSlide(r, i);
        SH.scroller.insertBefore(s, SH.endEl);
        SH.observer.observe(s);
    });
    SH.observer.observe(SH.endEl);
    SH.scroller.scrollTop = Math.min(SH.idx, SH.items.length) * SH.scroller.clientHeight;

    SH.scroller.addEventListener('wheel', e => {
        e.preventDefault();
        if (SH.wheelLock || Math.abs(e.deltaY) < 8) return;
        SH.wheelLock = true;
        shortsGo(e.deltaY > 0 ? 1 : -1);
        setTimeout(() => { SH.wheelLock = false; }, 700);
    }, { passive: false });
    document.getElementById('shorts-up').addEventListener('click', e => { shortsGo(-1); e.currentTarget.blur(); });
    document.getElementById('shorts-down').addEventListener('click', e => { shortsGo(1); e.currentTarget.blur(); });

    SH.onKey = e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
        switch (e.key) {
            case 'ArrowDown': case 'PageDown': case 'j': e.preventDefault(); shortsGo(1); break;
            case 'ArrowUp': case 'PageUp': case 'k': e.preventDefault(); shortsGo(-1); break;
            case ' ': e.preventDefault(); shortsTogglePlay(); break;
            case 'm': shortsToggleMute(); break;
        }
    };
    document.addEventListener('keydown', SH.onKey);

    SH.onVis = () => {
        const r = SH.activeRec;
        if (!r) return;
        if (document.hidden) r.el.pause(); else if (!r.userPaused) r.el.play().catch(() => {});
    };
    document.addEventListener('visibilitychange', SH.onVis);

    SH.ticker = setInterval(() => {
        const r = SH.activeRec;
        if (!r || !r.dom) return;
        const v = r.el, d = v.duration;
        r.dom.fill.style.width = (isFinite(d) && d ? (v.currentTime / d) * 100 : 0) + '%';
        const stuck = !v.paused && v.readyState < 3 && !r.dead;
        r.dom.spin.classList.toggle('on', stuck);
        if (stuck) { r.stuckMs = (r.stuckMs || 0) + 120; if (r.stuckMs > 10000) { r.stuckMs = 0; shortsPlaybackError(r); } }
        else r.stuckMs = 0;
    }, 120);

    ytPlayerCleanup = shortsCleanup;
    shortsUpdateEnd();
    shortsPump();
}

function shortsCleanup() {
    clearInterval(SH.ticker);
    if (SH.observer) SH.observer.disconnect();
    document.removeEventListener('keydown', SH.onKey);
    document.removeEventListener('visibilitychange', SH.onVis);
    SH.items.forEach(r => { try { r.el.pause(); } catch {} shortsHolder.appendChild(r.el); r.dom = null; });
    SH.root = SH.scroller = SH.endEl = SH.observer = null;
    SH.activeRec = null;
}

// ── Playback / navigation ──
function shortsSetActive(i) {
    SH.idx = i;
    const prev = SH.activeRec, rec = SH.items[i] || null;
    if (rec && rec === prev) { shortsPump(); return; }   // same Short re-reported: don't restart it
    if (prev && prev !== rec) { try { prev.el.pause(); } catch {} }
    SH.activeRec = rec;
    if (rec) shortsPlay(rec);
    SH.items.forEach((r, j) => { if (j < i - 2 && r.ready && !r.released) shortsRelease(r); });  // free memory behind us
    shortsPump();                                                                                  // keep preloading ahead
}

function shortsPlay(rec) {
    const v = rec.el;
    if (rec.dead) return;
    if (rec.released) {
        rec.released = false;
        v.src = mediaUrl(rec.instances[rec.inst], rec.id, 18);
        v.load();
    }
    try { v.currentTime = 0; } catch {}
    rec.userPaused = false; rec.stuckMs = 0;
    v.muted = SH.muted;
    const p = v.play();
    if (p && p.catch) p.catch(() => {
        v.muted = true; SH.muted = true;
        SH.items.forEach(shortsSyncMuteIcon);
        v.play().catch(() => {});
        toastMsg('Tap the speaker icon to unmute');
    });
}

function shortsGo(d) {
    if (!SH.scroller) return;
    const n = Math.max(0, Math.min(SH.items.length, SH.idx + d));
    const el = SH.scroller.children[n];
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function shortsTogglePlay() {
    const r = SH.activeRec;
    if (!r || !r.dom || r.dead) return;
    const paused = r.el.paused;
    r.userPaused = !paused;
    if (paused) r.el.play().catch(() => {}); else r.el.pause();
    const f = r.dom.flash;
    f.firstElementChild.className = 'fa ' + (paused ? 'fa-play' : 'fa-pause');
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}

function shortsSyncMuteIcon(rec) {
    if (rec.dom) rec.dom.muteIcon.className = 'fa ' + (SH.muted ? 'fa-volume-xmark' : 'fa-volume-high');
}
function shortsToggleMute() {
    SH.muted = !SH.muted;
    if (SH.activeRec) SH.activeRec.el.muted = SH.muted;
    SH.items.forEach(shortsSyncMuteIcon);
}

function shortsUpdateEnd() {
    if (!SH.endEl) return;
    const idle = !SH.fetching && SH.verifying === 0 && SH.cand.length === 0;
    const html = (SH.exhausted && idle)
        ? `<div class="short-endmsg"><i class="fa fa-film"></i>
             <div>${SH.items.length ? "You're all caught up for now" : "Couldn't find any Shorts right now"}</div>
             <button class="yt-btn" onclick="shortsRetry()">Look for more</button></div>`
        : `<div class="short-endmsg"><i class="fa fa-circle-notch fa-spin"></i><div>Finding more Shorts…</div></div>`;
    if (html !== SH.endHTML) { SH.endHTML = html; SH.endEl.innerHTML = html; }
}

function shortsRetry() {
    SH.exhausted = false; SH.emptyFetches = 0; SH.dryRounds = 0; SH.pages = {}; SH.cont = {}; SH.done = {};
    SH.seen = new Set(SH.items.map(r => r.id));
    shortsPump();
}

// Sources changed in Settings: throw away what was preloaded and start fresh.
function shortsHardReset() {
    SH.gen++;
    SH.items.forEach(r => { shortsDiscard(r.el); if (r.el.parentNode) r.el.parentNode.removeChild(r.el); });
    SH.items = []; SH.cand = []; SH.seen = new Set(); SH.pages = {}; SH.cont = {}; SH.done = {};
    SH.idx = 0; SH.activeRec = null; SH.exhausted = false;
    SH.emptyFetches = 0; SH.dryRounds = 0; SH.lastCount = 0; SH.creatorCursor = 0;
    setTimeout(shortsPump, 300);
}

// ── Settings helpers for Shorts sources ──
function addShortTag() {
    const input = document.getElementById('new-short-tag-input');
    let val = input.value.trim().toLowerCase();
    input.value = '';
    if (!val) return;
    if (!val.includes('#')) val = '#' + val;
    if (shortTags.includes(val)) return;
    shortTags.push(val); saveList('yyt_short_tags', shortTags);
    shortsHardReset(); render();
}
function removeShortTag(i) {
    if (shortTags.length <= 1) return;
    shortTags.splice(i, 1); saveList('yyt_short_tags', shortTags);
    shortsHardReset(); render();
}
function addShortCreator() {
    const input = document.getElementById('new-short-creator-input');
    const val = input.value.trim();
    input.value = '';
    if (!val || shortCreators.some(c => normName(c) === normName(val))) return;
    shortCreators.push(val); saveList('yyt_short_creators', shortCreators);
    shortsHardReset(); render();
}
function removeShortCreator(i) {
    shortCreators.splice(i, 1);
    if (shortCreators.length === 0) shortCreators = [...DEFAULT_SHORT_CREATORS];
    saveList('yyt_short_creators', shortCreators);
    shortsHardReset(); render();
}
function resetShortSources() {
    shortTags = [...DEFAULT_SHORT_TAGS]; shortCreators = [...DEFAULT_SHORT_CREATORS];
    saveList('yyt_short_tags', shortTags); saveList('yyt_short_creators', shortCreators);
    shortsHardReset(); render();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
loadFeed();
setTimeout(shortsPump, 2500);   // quietly warm up a few Shorts in the background
</script>
