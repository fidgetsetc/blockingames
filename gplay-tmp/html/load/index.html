<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loader</title>
    <style>
        html, body, iframe {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script>
        (function() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(window.location.search);
            const payload = hash || params.get('data');

            if (payload) {
                try {
                    const decoded = atob(payload);
                    document.open();
                    document.write(decoded);
                    document.close();
                } catch (e) {
                    document.body.textContent = "Malformed";
                }
            } else {
                document.body.textContent = "?data=encoded or #encoded needed. base64 encoded";
            }
        })();
    </script>
</body>
</html>
